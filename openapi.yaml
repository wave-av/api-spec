  # Chapters API — the nested /videos/{videoId}/chapters* shape below is DEPRECATED: verified
  # 2026-09-02 against the live gateway, both paths return 403 ROUTE_NOT_MAPPED (fail-closed,
  # "this path and method are not part of the WAVE API"). The gateway's live-priced Chapters
  # capability is the flat `/chapters` operation added further down this tag; keep both
  # documented (one dead, one live) until the nested shape is either wired up or removed —
  # see CHANGELOG.md.
  /videos/{videoId}/chapters:
    get:
      tags: [Chapters]
      summary: List chapters for a video
      operationId: listChapters
      deprecated: true
      x-status: unrouted
      description: >
        DEPRECATED — unrouted. The live gateway returns 403 ROUTE_NOT_MAPPED for this path;
        it is not part of the callable WAVE API. Use `GET /chapters` (the live-priced
        capability) instead.
      parameters:
        - name: videoId
          in: path
          required: true
          description: >-
            Identifier of an org-owned recording. Resolved org-scoped; a recording you do not own
            returns 404.
          schema:
            type: string
          example: rec-demo-0001
      responses:
        '200':
          description: List of chapters
          content:
            application/json:
              schema:
                type: object
                properties:
                  chapters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Chapter'
        '404':
          description: No recording with this id in your org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Chapters]
      summary: Create a chapter
      operationId: createChapter
      deprecated: true
      x-status: unrouted
      description: >
        DEPRECATED — unrouted. The live gateway returns 403 ROUTE_NOT_MAPPED for this path;
        it is not part of the callable WAVE API. Use `POST /chapters` (the live-priced
        capability) instead.
      parameters:
        - name: videoId
          in: path
          required: true
          description: >-
            Identifier of an org-owned recording. Resolved org-scoped; a recording you do not own
            returns 404.
          schema:
            type: string
          example: rec-demo-0001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterCreate'
      responses:
        '201':
          description: Chapter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'
        '404':
          description: No recording with this id in your org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /videos/{videoId}/chapters/detect:
    post:
      tags: [Chapters]
      summary: Start AI chapter detection
      operationId: detectChapters
      deprecated: true
      x-status: unrouted
      description: >
        DEPRECATED — unrouted. The live gateway returns 403 ROUTE_NOT_MAPPED for this path;
        it is not part of the callable WAVE API. Use `POST /chapters` (the live-priced
        capability) instead.
      parameters:
        - name: videoId

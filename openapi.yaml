    description: >-
      Live control & event plane — presence, pub/sub broadcast, and the streaming-event bus the WAVE
      AI products push into. Served at realtime.wave.online (not the api host); subscribe over one
      WebSocket, producers publish over REST. Auth federates to the gateway.
  - name: AV Mux/Demux
    description: >-
      Synchronous container-transform for local IP video + Dante/AES67 audio: mux separate RTP H.264
      video and Dante audio into one sync-locked MPEG-TS or fMP4 stream, and demux the inverse. x402
      metered per minute (`wave_av_minutes`) plus per transform-second (`wave_av_transform_seconds`).
  - name: Braided Audio
    description: >-
      On-demand WAVE Braided Audio publish — mixes multiple named audio sources into one
      MoQ-native braided track (single interleaved multichannel stream, not N independent
      streams). Requires the `moq:write` entitlement. Publishing spins up an on-demand machine;
      the same namespace can be republished (replacing the prior machine) or explicitly stopped.
  - name: MoQ
    description: >-
      Media over QUIC join-token mint — the only HTTP surface of the MoQ product. These two
      endpoints authorize the caller on the api host and return a short-lived signed join-token
      plus the relay URL to connect to; media never transits the API gateway, because the client
      opens the MoQ session DIRECTLY to the relay at moq.wave.online carrying that token. The media
      session itself is not an HTTP surface and is deliberately not modelled in this document: it
      is the IETF Media over QUIC Transport protocol (control + object frames over WebTransport /
      QUIC, with a WebSocket fallback for browsers that cannot open a raw QUIC session). To use it,
      point a MoQ client at `relayWsUrl` and pass the token as the `join` query parameter (browser
      WebSocket clients cannot set request headers) or, server-to-server, as the `x-wave-moq-join`
      request header — SDK clients mint the token; carrying it over the wire is the MoQ client's
      job. DRAFT VERSION: this surface corresponds to draft-ietf-moq-transport-18
      (https://datatracker.ietf.org/doc/draft-ietf-moq-transport/18/), which is what the WAVE relay
      currently speaks (preferred draft-18, negotiating draft-07..draft-18 over ALPN). draft-19 was
      published 2026-07-06 and is NOT yet deployed; adopting it is tracked internally.
      The join-token mint is transport-version independent — a draft bump changes the wire session,
      not this HTTP contract.

  - name: Render
    description: >-
      Code-defined video — render a branded, deterministic MP4 (or alpha ProRes) from a typed
      Brief. Pay-per-render over x402 (no signup); the payment proof is the identity. The same
      Brief renders to the same bytes on any host. Reference renderer is source-available (BSL).
  - name: Identity
    description: >-
      Agent directory — resolve a WAVE agent id to its public channel map (email, credential key
      name, org, channels). Read-only; public-directory data only, never secret material.


  parameters:
    RenderJobIdParam:
      name: jobId
      in: path
      required: true
      description: The render job id returned when the render was started asynchronously.
      schema:
        type: string
      example: 9f2c1a7e-4b3d-4c8a-9e21-6f0d5b8a1c34
    MoqNamespaceParam:
      name: ns
      in: path
      required: true
      description: >-
        MoQ namespace. Lowercase alphanumeric and dashes, 1–64 characters. The same value is bound
        into the minted token's claims and re-checked by the relay against the session it opens.
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,64}$'
        minLength: 1
        maxLength: 64
      example: demo-ns
    MoqTrackParam:
      name: track
      in: path
      required: true
      description: >-
        MoQ track name within the namespace. Lowercase alphanumeric and dashes, 1–64 characters.
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,64}$'
        minLength: 1
        maxLength: 64
      example: cam-1
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    StreamIdParam:
      name: streamId
      in: path
      required: true
      schema:
        type: string
    ProductionIdParam:
      name: productionId
      in: path
      required: true
      schema:
        type: string
    CameraIdParam:
      name: cameraId
      in: path
      required: true
      schema:
        type: string
    AnalyticsFromParam:
      name: from
      in: query
      description: Range start (ISO 8601 timestamp). Defaults to 30 days before `to`.
      schema:
        type: string
        format: date-time
    AnalyticsToParam:
      name: to
      in: query
      description: Range end (ISO 8601 timestamp). Defaults to now.
      schema:
        type: string
        format: date-time

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimitError:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required, or the API key / token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >
        The key is valid but lacks the scope or entitlement for this operation
        (e.g. SCOPE_OVERREACH, quota tier exhausted).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: >
        Payment required — the gateway answers with an x402 challenge instead of serving the
        request. **This response does NOT use the `Error` envelope.** Its `error` member is a plain
        string (`"payment required"`); the normalized WAVE error object is nested under
        `error_detail`. Complete the challenge in `accepts[0]` and retry with the `x-payment`
        header. Observed on `api.wave.online` 2026-07-25: a request with no API key AND a request
        with an unrecognized API key both receive this 402 (not a 401) on the MoQ mint routes, so a
        client must treat 402 as the ordinary "not yet authorized to pay-per-use" outcome.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/X402PaymentRequired'
    MoqJoinUnconfigured:
      description: >
        `MOQ_JOIN_UNCONFIGURED` — the mint is fail-closed and the signing secret is not provisioned
        in this environment. The gateway will never mint an unsigned or empty-key token. Not
        retryable by the caller; it clears when an operator provisions the secret.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamError:
      description: >
        An upstream capability provider (e.g. the speech engine) failed. The
        gateway interprets the failure and returns this normalized WAVE error
        instead of the raw upstream response, so the caller always sees a stable
        shape it can act on.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      description: >
        WAVE-normalized error envelope returned by the api.wave.online gateway.
        Upstream provider, auth, and quota failures are *interpreted* into this
        single shape — raw upstream errors (stack traces, vendor SDK objects) are
        never leaked to the caller. `error.code` is a stable machine-readable code
        (e.g. AUTH_REQUIRED, SCOPE_OVERREACH, RATE_LIMIT_EXCEEDED, UPSTREAM_ERROR);
        `error.message` is human-readable.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      description: >
        The normalized WAVE error object itself — the value of the `Error` envelope's
        `error` member. Referenced directly by bodies that carry the error object under
        a different key (the 402 x402 challenge nests it under `error_detail` without
        the envelope wrapper).
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-readable explanation, safe to surface to end users.
        details:
          type: object
          additionalProperties: true
          description: >
            Optional structured context (e.g. failing field, retry limit,
            requested scopes) — never raw upstream payloads.
        suggestions:
          type: array
          description: >
            Actionable next steps, ordered most→least likely to resolve the
            error. Written to be acted on by a human OR an agent.
          items:
            type: string
        did_you_mean:
          type: array
          description: >
            Closest valid alternatives when the caller likely made a typo or
            wrong choice (e.g. an unknown scope, product, or route).
          items:
            type: string
        doc_url:
          type: string
          format: uri
          description: Documentation link for this error.

    DeviceFlowError:
      type: object
      description: >-
        RFC 8628 §3.5 device-flow error passthrough from POST /agent/auth/token — a flat `{error}`
        string, not the WAVE error envelope, because it is the polling protocol, not a failure.
      required: [error]
      properties:
        error:
          type: string
          enum: [authorization_pending, slow_down, expired_token, access_denied, invalid_grant]
          description: >-
            `authorization_pending`: not yet approved, keep polling at the named interval.
            `slow_down`: poll less often. `expired_token`: the device_code expired, restart at
            /agent/auth/device. `access_denied`: the human declined. `invalid_grant`: the grant is
            no longer valid.

    Pagination:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'

    JobStatus:
      type: string
      enum: [pending, processing, completed, failed, cancelled]

    Attestation:
      type: object
      description: >
        WAVE Attestation envelope — a signed, verifiable record of exactly what a
        capability DID. This is NOT a financial receipt: customer payment receipts
        and invoices live in the billing domain (`Invoice`); an Attestation proves
        platform behaviour, not money owed. One shape, three instances: the Render
        Attestation, the Settlement Attestation (proof an x402 spend executed), and
        the Context Attestation. The bytes that are signed and verified are the
        *canonical* JSON of `attestation` (sorted keys, no whitespace), so any
        verifier reproduces exactly what the signer signed.
      required: [schema, attestation, alg]
      properties:
        schema:
          type: string
          description: Attestation payload schema id + version (matches the payload's own `schema_version`).
          examples: [wave.context-attestation/v0]
        attestation:
          type: object
          description: >
            The attested facts — one of the instance payload schemas (e.g.
            `#/components/schemas/ContextAttestation`).
          additionalProperties: true
        sig:
          type: [string, 'null']
          description: >
            Detached signature over the canonical JSON of `attestation`, encoded
            per `alg`, or null when unsigned (`alg: none`).
        alg:
          type: string
          description: >
            Signature algorithm (e.g. `ed25519`). `none` means the attestation is
            honestly unsigned; a present signature is trusted ONLY when a verifier
            confirms it over the canonical body — a signature that cannot be
            checked is never trusted.
          examples: [ed25519, none]
      allOf:
        # alg and sig MUST agree — making "signed but unsigned" un-representable:
        # unsigned  <=> alg == "none" AND sig == null
        # signed    <=> a concrete alg AND a present string sig
        # (the engine enforces this in attestation.envelope; the schema mirrors it
        # so a client can never read alg != "none" and then find sig absent/null.)
        - if:
            properties:
              alg: {const: none}
          then:
            properties:
              sig: {type: 'null'}
          else:
            required: [sig]
            properties:
              sig: {type: string}

    ContextAttestation:
      type: object
      description: >
        Proof of exactly what context a single model invocation was given — the
        Context Integrity instance of the WAVE Attestation standard. Travels as the
        `attestation` payload of an `Attestation` envelope
        (`schema: wave.context-attestation/v0`). The platform measures the window
        each model REALLY serves (not the advertised one) and either fits the
        prompt, routes up to a bigger window, or refuses — it never silently
        front-truncates.
      required:
        [model, served_window, effective_window, input_tokens, decision_kind, truncated, ts, schema_version]
      properties:
        model:
          type: string
          description: Target model identifier.
        served_window:
          type: integer
          description: >
            The context window the model ACTUALLY served, as measured by the Fleet
            Probe — not the advertised window. Trusting the measured value over the
            advertised one is the guarantee this attestation makes.
        effective_window:
          type: integer
          description: >
            Window available for input after carving out reserved output headroom,
            chat-template overhead, and tool/MCP schema tokens.
        input_tokens:
          type: integer
          description: >
            Conservative estimate of the prompt's input tokens (chars/token margin
            biased to never under-count).
        decision_kind:
          type: string
          enum: [fit, route_up, refuse]
          description: >
            The Truncation Guard's decision: `fit` (prompt fits), `route_up`
            (escalate to a bigger window), or `refuse` (loud — chunk or raise the
            window). Never silently truncates.
        truncated:
          type: boolean
          description: >
            True only if a downstream stage forced a truncation the guard would
            have refused. Normally false.
        ts:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the decision.
        schema_version:
          type: string
          description: Payload schema version (equals the envelope `schema`).
          examples: [wave.context-attestation/v0]

    RenderAttestation:
      type: object
      description: >
        WAVE Render Attestation v1 — the subject payload carried inside an `Attestation`
        envelope for `kind: render`. Attests that a specific renderer produced a specific
        output from a specific scene. The content-addressed envelope ID is derived from
        the canonical serialization of these fields (see `attestation/ATTESTATION-STANDARD-v1.md`).
      required:
        [v, kind, renderer, scene_sha256, output_sha256, format, bytes]
      properties:
        v:
          type: string
          maxLength: 64
          description: Version string. Equals the outer envelope `v` field.
          examples: ['wave.render-attestation/v1']
        kind:
          type: string
          const: render
          description: Always `"render"` for this payload type.
        renderer:
          type: string
          description: >
            Renderer identifier in `name@version/runtime` format, e.g.
            `wave-video@0.3.0/kernel`. Used to identify which build produced the output.
        scene_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 hex of the canonical scene input (the Brief or Scene IR).
        output_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 hex of the rendered output bytes.
        format:
          type: string
          enum: [mp4, alpha]
          description: Output container/codec family.
        bytes:
          type: integer
          minimum: 0
          description: Byte length of the rendered output.

    WaveAttestation:
      description: >
        Top-level wire envelope for any WAVE Attestation v1. Carried as the
        `wave.attestation` OTLP span attribute (JSON string) and stored in the
        `observability.attestation` table. The `id` is content-addressed:
        `sha256hex(canonicalJson(attestationSubject(envelope)))`.
        Invariant: `alg === "none"` ⟺ `sig === null`.
        See `attestation/ATTESTATION-STANDARD-v1.md` for the normative specification.
      type: object
      required: [id, kind, v, subject, alg]
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            Content-addressed ID: `sha256hex(canonicalJson(attestationSubject(envelope)))`.
            Stable across cache replays; upserts are idempotent by this key.
        kind:
          type: string
          enum: [render, context, settlement]
          description: Attestation kind.
        v:
          type: string
          maxLength: 64
          description: Version string, e.g. `wave.render-attestation/v1`.
        subject:
          type: object
          description: "Kind-specific payload. For `kind: render`, see `RenderAttestation`."
          additionalProperties: true
        alg:
          type: string
          maxLength: 32
          description: Signature algorithm. `"ed25519"` or `"none"`.
          examples: [ed25519, none]
        sig:
          type: [string, 'null']
          maxLength: 2048
          description: >
            Base64url-encoded Ed25519 signature over `canonicalJson(subject)` bytes.
            `null` when `alg` is `"none"`.
        created:
          oneOf:
            - type: integer
              description: Unix seconds.
            - type: string
              maxLength: 40
              description: ISO 8601 timestamp or unix seconds as string.
          description: When the attestation was minted.
      allOf:
        - if:
            properties:
              alg: {const: none}
          then:
            properties:
              sig: {type: 'null'}
          else:
            required: [sig]
            properties:
              sig: {type: string}

    # Clip schemas
    Clip:
      type: object
      properties:
        id:
          type: string
        videoId:
          type: string
        startTime:
          type: number
        endTime:
          type: number
        duration:
          type: number
        title:
          type: string
        description:
          type: string
        score:
          type: number
        category:
          type: string
        thumbnailUrl:
          type: string
          format: uri
        previewUrl:
          type: string
          format: uri
        status:
          $ref: '#/components/schemas/JobStatus'
        organizationId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClipCreate:
      type: object
      description: >-
        The real live-route request contract. `videoId` is NOT accepted — the
        live route requires `source` (a recording id) instead.
      required: [source, in]
      properties:
        source:
          type: string
          minLength: 1
          description: A recording id the gateway resolves to an org-scoped source URL.
        sourceType:
          type: string
          enum: [recording_id]
          default: recording_id
          description: >-
            Only `recording_id` is accepted — a raw storage key (`r2_key`) is
            rejected outright (cross-tenant read protection).
        visibility:
          type: string
          enum: [public, private]
          default: private
        in:
          type: string
          pattern: '^\d+(\.\d+)?(s|m)$'
          description: 'Clip start offset, a time string like "5s" or "2m" (0-10m).'
        out:
          type: string
          pattern: '^\d+(\.\d+)?(s|m)$'
          description: 'Clip end offset, a time string. Provide `out` or `duration`, not both.'
        duration:
          type: string
          pattern: '^\d+(\.\d+)?(s|m)$'
          description: 'Output clip length, a time string (1s-60s). Provide `out` or `duration`, not both.'
        width:
          type: integer
          minimum: 10
          maximum: 2000
        height:
          type: integer
          minimum: 10
          maximum: 2000
        fit:
          type: string
          enum: [contain, cover, scale-down]
          default: contain
        formats:
          type: array
          default: [mp4]
          items:
            type: string
            enum: [mp4, spritesheet, m4a, frame]
          description: '`frame` produces a single JPEG still at `in` and needs neither `out` nor `duration`.'
        quality:
          type: string
          enum: [720p, 1080p, 4k]
          default: 720p
        spritesheetFrames:
          type: integer
          minimum: 1
          maximum: 120
          default: 30

    ClipUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        startTime:
          type: number
        endTime:
          type: number

    ClipDetectRequest:
      type: object
      required: [videoId]
      properties:
        videoId:
          type: string
        minDuration:
          type: number
          default: 5
        maxDuration:
          type: number
          default: 60
        categories:
          type: array
          items:
            type: string
        sensitivity:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
        maxClips:
          type: integer

    DetectionJob:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        progress:
          type: integer
        createdAt:
          type: string
          format: date-time

    ClipCreateResponse:
      type: object
      description: The real POST /clips 201 response.
      properties:
        ok:
          type: boolean
          const: true
        clipId:
          type: string
        org:
          type: string
          description: The gateway-resolved owning organization.
        visibility:
          type: string
          enum: [public, private]
        source:
          type: string
        in:
          type: string
        duration:
          type: string
          description: 'Output clip duration, a time string like "12s".'
        quality:
          type: string
          enum: [720p, 1080p, 4k]
        assets:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [clip, spritesheet, audio, frame]
              key:
                type: string
                description: 'Org-prefixed storage key: ‹org›/{clips|public}/‹clipId›/…'
              contentType:
                type: string
              url:
                type: [string, 'null']
                description: Delivery URL — plain for public, HMAC-signed for private. null when delivery isn't configured.

    ClipError:
      type: object
      description: >-
        The clip-creation route's own error envelope for POST /clips — distinct from the
        gateway-normalized `Error` schema used elsewhere in this document.
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        detail:
          description: Optional structured detail. Absent or null on most errors.

    # Streams / Productions / Cameras / Billing / Analytics schemas (MCP-18 contract)
    Stream:
      type: object
      description: >-

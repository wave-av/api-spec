        syncOffsetMs:
          type: number
          description: Measured audio/video sync offset after alignment, in milliseconds (sub-millisecond target).

    RenderTemplate:
      type: string
      description: >-
        The render template. Per-template prop shapes are published in the live contract
        (GET /render/openapi.json) so this enum can never drift from what the renderer accepts.
      enum:
        - slate
        - lowerThird
        - announce
        - stat
        - hero
        - quote
        - backdrop
        - field
        - badge
        - endcard
        - sting
        - ident
        - kinetic
        - ticker
        - countdown
        - receipt
        - code
        - session
        - chart
        - audiogram
        - manifesto
        - changelog
    RenderBrief:
      type: object
      description: >-
        A render Brief — a template plus its props. Brand-parametric: an optional BYO `brandKit`
        (logo SVG, fonts as data URLs, colors) renders any template on a tenant's brand.
      required: [template, props]
      example:
        template: slate
        props:
          product: WAVE
          accent: '#16d6aa'
          tagline: Media infrastructure for the agentic internet.
      properties:
        template:
          $ref: '#/components/schemas/RenderTemplate'
        props:
          type: object
          description: >-
            Template-specific props. Each template publishes its own required and optional props
            (names, types, bounds, and defaults) in the live contract at `GET /render/openapi.json`
            so a caller can validate a Brief before sending it — this schema stays open by design.
            All string props are HTML-escaped; width/height ≤ 4096, durationMs ≤ 60000, fps ≤ 60.
          additionalProperties: true
    RenderResult:
      description: The delivery envelope (Accept application/json). `sha256` is the determinism receipt.
      oneOf:
        - $ref: '#/components/schemas/RenderResultInline'
        - $ref: '#/components/schemas/RenderResultUrl'
    RenderResultInline:
      type: object
      required: [delivery, format, sha256, bytes, contentType, dataUrl]
      properties:
        delivery: { type: string, enum: [inline] }
        format: { type: string, enum: [mp4] }
        sha256: { type: string, description: sha256 of the output bytes (determinism receipt). }
        bytes: { type: integer }
        contentType: { type: string, enum: [video/mp4] }
        dataUrl: { type: string, description: base64 data URL of the output (small MP4s only). }
    RenderResultUrl:
      type: object
      required: [delivery, format, sha256, bytes, url, expiresAtSec, contentType]
      properties:
        delivery: { type: string, enum: [url] }
        format: { type: string, enum: [mp4, alpha] }
        sha256: { type: string, description: sha256 of the output bytes (determinism receipt). }
        bytes: { type: integer }
        url: { type: string, description: 'Signed, single-object, expiring URL on downloads.wave.online.' }
        expiresAtSec: { type: integer, description: Absolute Unix expiry of the signed URL. }
        contentType: { type: string, enum: [video/mp4, video/quicktime] }

    RenderJobStatus:
      type: string
      description: >-
        Lifecycle of an async render. Deliberately NOT the platform-wide `JobStatus` enum — the
        render pipeline reports its own delivery-aware states, and collapsing the two would
        misreport `delivering` (output produced, upload in flight) as either finished or failed.
      enum: [queued, rendering, delivering, done, error]
    RenderJobView:
      type: object
      description: >-
        A point-in-time view of an async render job. Only `jobId` and `status` are always present;
        the delivery and receipt fields appear once `status` is `done`, and `error` appears only
        when `status` is `error`.
      required: [jobId, status]
      properties:
        jobId: { type: string }
        status: { $ref: '#/components/schemas/RenderJobStatus' }
        url: { type: string, description: 'Terminal (done): the signed delivery URL.' }
        expiresAtSec: { type: integer, description: 'Terminal (done): absolute Unix expiry of `url`.' }
        sha256: { type: string, description: 'Terminal (done): determinism receipt — sha256 of the output bytes.' }
        bytes: { type: integer, description: 'Terminal (done): output size in bytes.' }
        meters:
          type: array
          description: 'Terminal (done): the billable usage lines this render billed.'
          items:
            type: object
            properties:
              event: { type: string }
              quantity: { type: number }
        error:
          type: object
          description: 'Terminal (error): a typed, client-safe error.'
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    MoqJoinToken:
      type: object
      description: >-
        A minted MoQ join-token and everything needed to open the media session. `joinToken` is a
        short-lived HMAC-signed bearer bound to exactly this `ns`/`track`, `role`, and the caller's
        organization; the relay derives identity and scope from the signed claims and never from a
        client-supplied header. Connect to `relayWsUrl` carrying the token as the `join` query
        parameter (browser clients) or the `x-wave-moq-join` header (server-to-server). Never log,
        cache, or persist `joinToken`; mint a fresh one per session.
      required: [ok, relayWsUrl, joinToken, expiresIn, ns, track, role, scope]
      properties:
        ok:
          type: boolean
          description: Always `true` on a successful mint.
        relayWsUrl:
          type: string
          format: uri
          description: >-
            The DIRECT relay URL for this session, e.g.
            `wss://moq.wave.online/v1/publish/{ns}/{track}`. Media flows here, not through the API
            gateway.
        joinToken:
          type: string
          description: >-
            The signed join-token (`base64url(header).base64url(payload).base64url(signature)`,
            HMAC-SHA256, `typ: MOQJ` so it can never be confused with an API key). Treat as a
            secret.
        expiresIn:
          type: integer
          description: >-
            Token lifetime in seconds from mint. Currently 120; the relay additionally rejects any
            token whose signed lifetime exceeds the contract ceiling, and allows a few seconds of
            clock skew.
        ns:
          type: string
          description: The namespace the token is bound to (echoes the path parameter).
        track:
          type: string
          description: The track the token is bound to (echoes the path parameter).
        role:
          type: string
          enum: [publish, subscribe]
          description: Derived from the route, never from a client field.
        scope:
          type: string
          enum: ['moq:write', 'moq:read']
          description: >-
            The single scope granted by this token — `moq:write` for publish, `moq:read` for
            subscribe. Least-privilege: a subscribe token cannot publish.
        protocol:
          type: string
          description: >-
            Present only when a publisher declared a recognized, authorized origin protocol at mint
            time (see `x-wave-declare-protocol`). Absent means the session bills as plain `moq`.

    X402PaymentRequired:
      type: object
      description: >-
        The x402 payment-challenge body returned with HTTP 402. Distinct from the `Error` envelope:
        `error` here is a human-readable string and the normalized WAVE error object is nested under
        `error_detail`.
      required: [x402Version, error, accepts]
      properties:
        x402Version:
          type: integer
          description: x402 protocol version (currently 1).
        error:
          type: string
          description: Short reason, e.g. `payment required`.
        accepts:
          type: array
          description: Payment options; sign one and retry with the `x-payment` header.
          items:
            $ref: '#/components/schemas/X402Accepts'
        error_detail:
          allOf:
            - $ref: '#/components/schemas/ErrorBody'
            - type: object
              properties:
                payment_rejected:
                  type: object
                  description: >-
                    Present ONLY when a submitted payment was REJECTED (as opposed to no payment
                    having been made at all): the sanitized deny verdict, so a paying caller can
                    tell a rejected payment apart from an unpaid challenge and correct the named
                    field. `reason` is a lowercase snake_case token from the gateway's closed deny
                    vocabulary (e.g. `invalid_permit_header`, `session_expired`, `duplicate`,
                    `rate_limited`); internal detail that cannot be published verbatim collapses
                    to the generic `payment_rejected`. `rail` names the payment rail that denied
                    (e.g. `base-usdc`, `tempo-pathusd`), or `unknown`.
                  required: [reason, rail]
                  properties:
                    reason:
                      type: string
                      description: Sanitized machine-readable rejection reason token.
                    rail:
                      type: string
                      description: The payment rail the rejection occurred on.
        next_action:
          type: object
          additionalProperties: true
          description: >-
            Machine-executable directive for agent callers — a `pay` directive carrying the same
            `accepts` options.

    X402Accepts:
      type: object
      description: One acceptable payment option in an x402 challenge.
      properties:
        scheme:
          type: string
          description: Payment scheme, e.g. `exact`.
        protocol:
          type: string
          description: Always `x402`.
        network:
          type: string
          description: Settlement network, e.g. `base`.
        maxAmountRequired:
          type: string
          description: Amount in the asset's smallest unit, as a decimal string.
        resource:
          type: string
          description: The request path being charged for.
        description:
          type: string
        mimeType:
          type: string
        payTo:
          type: string
          description: Destination address for the payment.
        maxTimeoutSeconds:
          type: integer
        asset:
          type: string
          description: Contract address of the settlement asset.
        extra:
          type: object
          additionalProperties: true
          description: Scheme-specific metadata (e.g. settlement mode, session id).

    PricingManifest:
      type: object
      properties:
        slug: { type: string }
        org: { type: string }
        tiers: { type: array, items: { type: object, additionalProperties: true } }
        createdAt: { type: string }
        updatedAt: { type: string }
      additionalProperties: true


    IdentityResolveResponse:
      description: >
        The resolved directory entry, DISCRIMINATED on the outer `agent` value:
        `agent: "telephony"` serves the TelephonyResolveResponse variant; every other
        directory key serves the AgentResolveResponse variant. Generated clients can
        narrow on `agent`.
      oneOf:
        - $ref: '#/components/schemas/AgentResolveResponse'
        - $ref: '#/components/schemas/TelephonyResolveResponse'

    AgentResolveResponse:
      type: object
      additionalProperties: false
      required: [agent, identity]
      properties:
        agent:
          type: string
          pattern: '^[a-z0-9-]{1,64}$'
          not: { const: telephony }
          description: The resolved agent id — any directory key EXCEPT the telephony service entry
        identity:
          $ref: '#/components/schemas/AgentIdentity'

    TelephonyResolveResponse:
      type: object
      additionalProperties: false
      required: [agent, identity]
      properties:
        agent:
          const: telephony
        identity:
          $ref: '#/components/schemas/TelephonyIdentity'

    AgentIdentity:
      type: object
      additionalProperties: false
      description: >
        One agent's public directory entry. `key` is a credential key NAME, never a key
        value — the directory carries no secret material.
      required: [email, key, org, channels]
      properties:
        email:
          type: string
          format: email
          description: The agent's inbox (e.g. `opencode@agents.wave.online`)
        key:
          type: string
          pattern: '^[A-Z0-9_]+$'
          description: Credential key NAME for the agent's inbox credential (never the value)
        org:
          type: string
          description: Owning org (e.g. `wave`)
        channels:
          type: array
          items: { type: string }
          description: Reachable channels (e.g. `mail`, `paid-rail`, `realtime`)

    TelephonyIdentity:
      type: object
      additionalProperties: false
      description: >
        The telephony service entry — the one documented variation on the agent shape:
        plural credential key names + E.164 numbers, no email/key. `org` is always present
        so every identity object carries it.
      required: [org, channels, numbers, keys]
      properties:
        org:
          type: string
          description: Owning org (e.g. `wave`)
        channels:
          type: array
          items: { type: string }
          description: Reachable channels (e.g. `voice`, `sms-blocked-a2p`)
        numbers:
          type: array
          items: { type: string, pattern: '^\+[1-9]\d{1,14}$' }
          description: E.164 numbers
        keys:
          type: array
          items: { type: string, pattern: '^[A-Z0-9_]+$' }
          description: Credential key NAMES for the telephony credentials (never values)

    IdentityResolveValidationError:
      type: object
      description: >
        400 envelope for /identity/resolve — `error.code` is one of the documented
        validation codes, so generated clients can switch on it.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [MISSING_AGENT, BAD_AGENT, ORG_MISMATCH]
            message:
              type: string

    IdentityResolveNotFoundError:
      type: object
      description: >
        404 envelope for /identity/resolve — `error.code` is always UNKNOWN_AGENT;
        `agent` echoes the requested id.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [UNKNOWN_AGENT]
            message:
              type: string
        agent:
          type: string
          description: Echo of the requested (unknown) agent id

    # Voice schemas
    Voice:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        previewUrl:
          type: string
          format: uri
        category:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string

    VoiceGeneration:
      type: object
      properties:
        id:
          type: string
        voiceId:
          type: string
        text:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        audioUrl:
          type: string
          format: uri
        alignment:
          $ref: '#/components/schemas/VoiceAlignment'
        duration:
          type: number
        characterCount:
          type: integer
        model:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    VoiceAlignment:
      type: object
      description: >
        Character-level timing for the generated audio, present only when the
        request set `timestamps: true`. A direct passthrough of the engine's
        alignment, so clients can render karaoke highlighting and derive caption
        cues. The three arrays are parallel (same length, always present together).
        Property names are snake_case because this is a verbatim passthrough of the
        speech engine's alignment, which downstream caption/karaoke consumers parse
        by these exact keys.
      required: [characters, character_start_times_seconds, character_end_times_seconds]
      properties:
        characters:
          type: array
          items:
            type: string
        character_start_times_seconds:
          type: array
          items:
            type: number
        character_end_times_seconds:
          type: array
          items:
            type: number

    VoiceSynthesisInline:
      type: object
      description: >
        Synchronous voice synthesis result returned inline in a single round-trip.
        Used when `timestamps: true`, so the caller receives audio and character-level
        `alignment` together with no polling — the shape the blog karaoke/caption
        pipeline consumes. When timestamps are not requested the gateway may instead
        return raw audio bytes (audio/mpeg) or an async VoiceGeneration job.
      required: [audio_base64]
      properties:
        audio_base64:
          type: string
          format: byte
          description: Base64-encoded audio payload (container/codec per `outputFormat`).
        alignment:
          $ref: '#/components/schemas/VoiceAlignment'
        format:
          type: string
          description: Audio container/codec of the decoded bytes (e.g. mp3_44100_128).

    VoiceGenerateRequest:
      type: object
      required: [voiceId, text]
      properties:
        voiceId:
          type: string
        text:
          type: string
        stability:
          type: number
          minimum: 0
          maximum: 1
          default: 0.5
        similarityBoost:
          type: number
          minimum: 0
          maximum: 1
          default: 0.75
        style:
          type: number
          minimum: 0
          maximum: 1
          default: 0
        model:
          type: string
          default: eleven_multilingual_v2
        outputFormat:
          type: string
          default: mp3_44100_128
        timestamps:
          type: boolean
          default: false
          description: >
            When true, the resulting VoiceGeneration includes character-level
            `alignment` (start/end times) so clients can render karaoke highlighting
            and derive caption cues. Backed by the engine's with-timestamps mode.

    VoiceCloneRequest:
      type: object
      required: [name, audioFiles]
      properties:
        name:
          type: string
        audioFiles:
          type: array
          items:
            type: string
            format: uri
          minItems: 1
          maxItems: 25
        description:

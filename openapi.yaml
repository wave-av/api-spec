  # Realtime API — served at realtime.wave.online (per-operation server override). WebSocket subscribe
  # is documented descriptively (OpenAPI has no native WS); REST publish/presence/history are first-class.
  /realtime/connect:
    get:
      tags: [Realtime]
      summary: Subscribe to a channel (WebSocket)
      operationId: realtimeConnect
      description: >-
        Open a WebSocket to subscribe to a channel. This is a WebSocket upgrade (HTTP 101), not a normal
        GET — clients send `Upgrade: websocket`. Browser/SDK clients that cannot set headers may pass the
        key as `?access_token=`. On connect the server sends a `welcome` frame (current presence +
        recent history), then live frames: `message` (a published event), `join`/`leave` (presence),
        `presence` (full list). The real path is `/v1/connect?channel=<id>`.
      servers:
        - url: https://realtime.wave.online
          description: WAVE Realtime edge
      parameters:
        - name: channel
          in: query
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9:_-]{0,127}$' }
          description: Namespaced channel id, e.g. `stream:abc`, `room:xyz`.
        - name: as
          in: query
          required: false
          schema: { type: string }
          description: Member id to present as (defaults to the caller's key prefix).
      responses:
        '101':
          description: Switching Protocols — WebSocket established.
        '401': { description: Authentication required }
        '426': { description: Upgrade required (not a WebSocket request) }
  /realtime/channels/{channel}/publish:
    post:
      tags: [Realtime]
      summary: Publish an event to a channel
      operationId: realtimePublish
      description: Producer endpoint — publish one event to every subscriber of a channel. The real path is `/v1/channels/{channel}/publish`.
      servers:
        - url: https://realtime.wave.online
          description: WAVE Realtime edge
      parameters:
        - name: channel
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event:
                  type: string
                  description: Event name, e.g. `caption.cue`, `sentiment.tick`, `clip.created`, `stream.started`.
                data:
                  description: Arbitrary JSON payload for the event.
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  delivered: { type: integer, description: Number of subscribers the event reached }
        '401': { description: Authentication required }
  /realtime/channels/{channel}/presence:
    get:
      tags: [Realtime]
      summary: Current presence for a channel
      operationId: realtimePresence
      description: The real path is `/v1/channels/{channel}/presence`.
      servers:
        - url: https://realtime.wave.online
          description: WAVE Realtime edge
      parameters:
        - name: channel
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Presence list
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel: { type: string }
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
  /realtime/channels/{channel}/history:
    get:
      tags: [Realtime]
      summary: Recent event history for a channel
      operationId: realtimeHistory
      description: Last-N events (≤50). The real path is `/v1/channels/{channel}/history`.
      servers:
        - url: https://realtime.wave.online
          description: WAVE Realtime edge
      parameters:
        - name: channel
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 50 }
      responses:
        '200':
          description: Recent events
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel: { type: string }
                  events:
                    type: array
                    items: { type: object }

  # Braided Audio API
  /braid/publish:
    post:
      tags: [Braided Audio]
      summary: Publish a braided audio track
      operationId: publishBraidAudio
      description: >-
        Starts (or replaces) an on-demand braid publisher for `ns`, mixing `sources` into one
        interleaved multichannel MoQ track. Requires the `moq:write` entitlement. If a machine is
        already live for this `org`/`ns`, it is torn down and replaced. Subject to per-org
        concurrency and creation-rate limits (429 `QUOTA_EXCEEDED` when exceeded).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BraidPublishRequest'
      responses:
        '201':
          description: Braid machine starting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BraidPublishResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Per-org concurrency or creation-rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Braid publish unavailable — the worker is not provisioned for on-demand publish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /braid/publish/{ns}:
    delete:
      tags: [Braided Audio]
      summary: Stop a braided audio publish
      operationId: stopBraidAudio
      description: >-
        Explicit early stop for a live braid machine in this namespace. Requires the `moq:write`
        entitlement. Tears down the machine via the same path `publishBraidAudio`'s replace
        action uses, so usage accounting is always consistent.
      parameters:
        - name: ns
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Braid machine stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BraidStopResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No live braid machine for this namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Braid publish unavailable — the worker is not provisioned for on-demand publish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Enhance API
  /enhance:
    post:
      tags: [Enhance]
      summary: Super-resolve a video with an AI model (x402-payable)
      operationId: enhanceVideo
      description: >-
        Upscales a video with an on-graph AI model. v1 ships exactly one model, `espcn` (ESPCN
        super-resolution, a fixed exact 3x factor baked into the trained weights — not a runtime
        parameter). Internally every input frame is letterboxed to a fixed working canvas before
        inference, so the v1 output resolution is fixed regardless of input resolution; a future
        model may support other output shapes. Send either the raw video bytes as the request body
        or a `url` query parameter pointing at an `https` source (the source is fetched
        server-side; redirects are not followed and non-public/loopback/private hosts are
        rejected). Requires the `enhance:write` entitlement. Billed against the
        `wave_enhance_minutes` meter: the OUTPUT artifact's rendered duration in minutes, rounded
        up to the next whole minute.


        Distinct from the Studio AI enhancement surface (`POST /studio-ai/enhancements`, which
        also offers `upscale`/`super_resolution` job types): Studio AI runs asynchronous,
        credit-billed jobs against library videos and returns a job envelope, whereas this
        endpoint synchronously super-resolves ad-hoc video bytes (or an `https` source) and
        streams the result back, billing `wave_enhance_minutes`. Use Studio AI for library
        workflows; use this endpoint for direct, pay-per-call enhancement.
      parameters:
        - name: model
          in: query
          required: false
          schema:
            type: string
            enum: [espcn]
            default: espcn
          description: AI model to apply. v1 supports only `espcn`; any other value 400s.
        - name: url
          in: query
          required: false
          schema:
            type: string
            format: uri
          description: >-
            Fetch the source video from this `https` URL instead of sending it as the request
            body. Must be publicly reachable — loopback, private, link-local, and `.local`/
            `.internal` hosts are rejected before any fetch.
      requestBody:
        required: false
        description: >-
          The source video, raw bytes. Omit the body (and use `?url=` instead) to have the source
          fetched server-side. Max 200 MiB either way.
        content:
          video/*:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: >-
            The enhanced video, binary, streamed back with the same content-type as the source.
            Per-job receipt and billing metadata are carried on response headers, not a JSON body.
          headers:
            x-enhance-model:
              schema:
                type: string
              description: The model that ran, e.g. `espcn`.
            x-enhance-scale-factor:
              schema:
                type: number
              description: Upscale factor actually applied.
            x-enhance-input-dimensions:
              schema:
                type: string
              description: Input frame dimensions as `WIDTHxHEIGHT`, e.g. `1280x720`.
            x-enhance-output-dimensions:
              schema:
                type: string
              description: Output frame dimensions as `WIDTHxHEIGHT`, e.g. `672x672`.
            x-wave-meter:
              schema:
                type: string
              description: The meter this job billed against — `wave_enhance_minutes`.
            x-wave-usage-minutes:
              schema:
                type: integer
              description: Output-duration minutes billed for this job (rounded up).
          content:
            video/*:
              schema:
                type: string
                format: binary
        '400':
          description: >-
            Invalid request — unrecognized `model`, an unsafe or invalid `url`, or no video
            supplied (neither a request body nor `?url=`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: The source video (request body, or the resolved `?url=` source) exceeds the 200 MiB limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            `INPUT_TOO_LARGE` — the source video's frame dimensions exceed the v1 input-size cap.
            Downscale the source and retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '501':
          description: Enhance is not yet available in this environment (the spoke is not provisioned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          description: >-
            The enhance backend is temporarily unavailable (e.g. cold-start / pool exhaustion).
            Retryable; honor the `Retry-After` header.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # AV Mux/Demux API — synchronous container-transform path (RTP H.264 video + Dante/AES67 audio).
  /av/remux:
    post:
      tags: [AV Mux/Demux]
      summary: Mux synchronized IP video + Dante audio into one container
      operationId: avRemux
      description: >-
        Synchronizes local IP video (RTP H.264) and separate Dante/AES67 audio into one sync-locked
        container stream (MPEG-TS or fMP4). Requires the `av:write` entitlement. x402-gated; billed
        per-minute (`wave_av_minutes`) plus per transform-second (`wave_av_transform_seconds`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvRemuxRequest'
      responses:
        '200':
          description: Muxed container stream — binary, or an AvTransformResult envelope under Accept application/json.
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/AvTransformResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '402':
          description: Payment required — pay the x402 challenge and retry.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: The x402 challenge, including the quoted price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: AV mux/demux unavailable — the spoke is not provisioned (AV_ORIGIN unset).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /av/demux:
    post:
      tags: [AV Mux/Demux]
      summary: Demux one container back into separate video + Dante audio
      operationId: avDemux
      description: >-
        Inverse of `/av/remux` — splits a synchronized MPEG-TS/fMP4 container back into local IP video
        (RTP H.264 out) and Dante/AES67 audio out, preserving sub-millisecond sync. Requires the
        `av:write` entitlement. x402-gated; billed per-minute (`wave_av_minutes`) plus per
        transform-second (`wave_av_transform_seconds`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvDemuxRequest'
      responses:
        '200':
          description: Demux result — routed IP-video + Dante sink status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvTransformResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '402':
          description: Payment required — pay the x402 challenge and retry.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: The x402 challenge, including the quoted price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: AV mux/demux unavailable — the spoke is not provisioned (AV_ORIGIN unset).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # MoQ API — join-token mint. The media session runs DIRECT to the relay (see the MoQ tag).
  /moq/publish/{ns}/{track}:
    post:
      tags: [MoQ]
      summary: Mint a MoQ publish join-token
      operationId: mintMoqPublishToken
      description: >-
        Authorizes the caller to PUBLISH to `ns`/`track` and returns a short-lived signed join-token
        (`role: publish`, `scope: moq:write`) plus the `relayWsUrl` to connect to. Requires the
        `moq:write` scope. The token is a bearer credential valid for `expiresIn` seconds — mint one
        per session immediately before connecting; do not cache or log it (the response is served
        `cache-control: no-store`). The durable API key never leaves the client. A publisher may
        declare the origin protocol of the stream it is about to publish with the
        `x-wave-declare-protocol` header so usage is billed against that protocol dimension. The
        declaration is only honoured on this publish leg, only for a recognized protocol, and only
        for orgs the operator has allowlisted; an unrecognized or unauthorized value is silently
        ignored and the session bills as plain `moq` — it never fails the mint.
      parameters:
        - $ref: '#/components/parameters/MoqNamespaceParam'
        - $ref: '#/components/parameters/MoqTrackParam'
        - name: x-wave-declare-protocol
          in: header
          required: false
          schema:
            type: string
          description: >-
            Optional declared origin protocol for billing (e.g. `moq`). Ignored unless recognized and
            authorized for this org; never rejects the mint.
      responses:
        '200':
          description: >-
            Join-token minted. Served `cache-control: no-store` — never cache or log `joinToken`.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store` — the response carries a short-lived bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoqJoinToken'
        '400':
          description: >-
            `MOQ_JOIN_BAD_RESOURCE` — `ns` or `track` does not match `^[a-z0-9-]{1,64}$`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          $ref: '#/components/responses/MoqJoinUnconfigured'

  /moq/subscribe/{ns}/{track}:
    get:
      tags: [MoQ]
      summary: Mint a MoQ subscribe join-token
      operationId: mintMoqSubscribeToken
      description: >-
        Authorizes the caller to SUBSCRIBE to `ns`/`track` and returns a short-lived signed
        join-token (`role: subscribe`, `scope: moq:read`) plus the `relayWsUrl` to connect to.
        Requires the `moq:read` scope. Least-privilege: a subscribe token grants read only — it
        cannot be replayed to publish, and the relay re-checks the signed `ns`/`track` against the
        session it is actually opening, so a token is bound to exactly one resource.
      parameters:
        - $ref: '#/components/parameters/MoqNamespaceParam'
        - $ref: '#/components/parameters/MoqTrackParam'
      responses:
        '200':
          description: >-
            Join-token minted. Served `cache-control: no-store` — never cache or log `joinToken`.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store` — the response carries a short-lived bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoqJoinToken'
        '400':
          description: >-
            `MOQ_JOIN_BAD_RESOURCE` — `ns` or `track` does not match `^[a-z0-9-]{1,64}$`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          $ref: '#/components/responses/MoqJoinUnconfigured'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: |
        API key authentication. Get your API key from the WAVE Developer Portal.

  parameters:
    RenderJobIdParam:
      name: jobId
      in: path
      required: true
      description: The render job id returned when the render was started asynchronously.
      schema:
        type: string
      example: 9f2c1a7e-4b3d-4c8a-9e21-6f0d5b8a1c34
    MoqNamespaceParam:
      name: ns
      in: path
      required: true
      description: >-
        MoQ namespace. Lowercase alphanumeric and dashes, 1–64 characters. The same value is bound
        into the minted token's claims and re-checked by the relay against the session it opens.
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,64}$'
        minLength: 1
        maxLength: 64
      example: demo-ns
    MoqTrackParam:
      name: track
      in: path
      required: true
      description: >-
        MoQ track name within the namespace. Lowercase alphanumeric and dashes, 1–64 characters.
      schema:
        type: string
        pattern: '^[a-z0-9-]{1,64}$'
        minLength: 1
        maxLength: 64
      example: cam-1
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: perPage
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimitError:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required, or the API key / token is invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: >
        The key is valid but lacks the scope or entitlement for this operation
        (e.g. SCOPE_OVERREACH, quota tier exhausted).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequired:
      description: >
        Payment required — the gateway answers with an x402 challenge instead of serving the
        request. **This response does NOT use the `Error` envelope.** Its `error` member is a plain
        string (`"payment required"`); the normalized WAVE error object is nested under
        `error_detail`. Complete the challenge in `accepts[0]` and retry with the `x-payment`
        header. Observed on `api.wave.online` 2026-07-25: a request with no API key AND a request
        with an unrecognized API key both receive this 402 (not a 401) on the MoQ mint routes, so a
        client must treat 402 as the ordinary "not yet authorized to pay-per-use" outcome.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/X402PaymentRequired'
    MoqJoinUnconfigured:
      description: >
        `MOQ_JOIN_UNCONFIGURED` — the mint is fail-closed and the signing secret is not provisioned
        in this environment. The gateway will never mint an unsigned or empty-key token. Not
        retryable by the caller; it clears when an operator provisions the secret.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamError:
      description: >
        An upstream capability provider (e.g. the speech engine) failed. The
        gateway interprets the failure and returns this normalized WAVE error
        instead of the raw upstream response, so the caller always sees a stable
        shape it can act on.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      description: >
        WAVE-normalized error envelope returned by the api.wave.online gateway.
        Upstream provider, auth, and quota failures are *interpreted* into this
        single shape — raw upstream errors (stack traces, vendor SDK objects) are
        never leaked to the caller. `error.code` is a stable machine-readable code
        (e.g. AUTH_REQUIRED, SCOPE_OVERREACH, RATE_LIMIT_EXCEEDED, UPSTREAM_ERROR);
        `error.message` is human-readable.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable explanation, safe to surface to end users.
            details:
              type: object
              additionalProperties: true
              description: >
                Optional structured context (e.g. failing field, retry limit,
                requested scopes) — never raw upstream payloads.
            suggestions:
              type: array
              description: >
                Actionable next steps, ordered most→least likely to resolve the
                error. Written to be acted on by a human OR an agent.
              items:
                type: string
            did_you_mean:
              type: array
              description: >
                Closest valid alternatives when the caller likely made a typo or
                wrong choice (e.g. an unknown scope, product, or route).
              items:
                type: string
            doc_url:
              type: string
              format: uri
              description: Documentation link for this error.

    Pagination:
      type: object
      properties:
        page:
          type: integer
        perPage:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        pagination:
          $ref: '#/components/schemas/Pagination'

    JobStatus:
      type: string
      enum: [pending, processing, completed, failed, cancelled]

    Attestation:
      type: object
      description: >
        WAVE Attestation envelope — a signed, verifiable record of exactly what a
        capability DID. This is NOT a financial receipt: customer payment receipts
        and invoices live in the billing domain (`Invoice`); an Attestation proves
        platform behaviour, not money owed. One shape, three instances: the Render
        Attestation, the Settlement Attestation (proof an x402 spend executed), and
        the Context Attestation. The bytes that are signed and verified are the
        *canonical* JSON of `attestation` (sorted keys, no whitespace), so any
        verifier reproduces exactly what the signer signed.
      required: [schema, attestation, alg]
      properties:
        schema:
          type: string
          description: Attestation payload schema id + version (matches the payload's own `schema_version`).
          examples: [wave.context-attestation/v0]
        attestation:
          type: object
          description: >
            The attested facts — one of the instance payload schemas (e.g.
            `#/components/schemas/ContextAttestation`).
          additionalProperties: true
        sig:
          type: [string, 'null']
          description: >
            Detached signature over the canonical JSON of `attestation`, encoded
            per `alg`, or null when unsigned (`alg: none`).
        alg:
          type: string
          description: >
            Signature algorithm (e.g. `ed25519`). `none` means the attestation is
            honestly unsigned; a present signature is trusted ONLY when a verifier
            confirms it over the canonical body — a signature that cannot be
            checked is never trusted.
          examples: [ed25519, none]
      allOf:
        # alg and sig MUST agree — making "signed but unsigned" un-representable:
        # unsigned  <=> alg == "none" AND sig == null
        # signed    <=> a concrete alg AND a present string sig
        # (the engine enforces this in attestation.envelope; the schema mirrors it
        # so a client can never read alg != "none" and then find sig absent/null.)
        - if:
            properties:
              alg: {const: none}
          then:
            properties:
              sig: {type: 'null'}
          else:
            required: [sig]
            properties:
              sig: {type: string}

    ContextAttestation:
      type: object
      description: >
        Proof of exactly what context a single model invocation was given — the
        Context Integrity instance of the WAVE Attestation standard. Travels as the
        `attestation` payload of an `Attestation` envelope
        (`schema: wave.context-attestation/v0`). The platform measures the window
        each model REALLY serves (not the advertised one) and either fits the
        prompt, routes up to a bigger window, or refuses — it never silently
        front-truncates.
      required:
        [model, served_window, effective_window, input_tokens, decision_kind, truncated, ts, schema_version]
      properties:
        model:
          type: string
          description: Target model identifier.
        served_window:
          type: integer
          description: >
            The context window the model ACTUALLY served, as measured by the Fleet
            Probe — not the advertised window. Trusting the measured value over the
            advertised one is the guarantee this attestation makes.
        effective_window:
          type: integer
          description: >
            Window available for input after carving out reserved output headroom,
            chat-template overhead, and tool/MCP schema tokens.
        input_tokens:
          type: integer
          description: >
            Conservative estimate of the prompt's input tokens (chars/token margin
            biased to never under-count).
        decision_kind:
          type: string
          enum: [fit, route_up, refuse]
          description: >
            The Truncation Guard's decision: `fit` (prompt fits), `route_up`
            (escalate to a bigger window), or `refuse` (loud — chunk or raise the
            window). Never silently truncates.
        truncated:
          type: boolean
          description: >
            True only if a downstream stage forced a truncation the guard would
            have refused. Normally false.
        ts:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the decision.
        schema_version:
          type: string
          description: Payload schema version (equals the envelope `schema`).
          examples: [wave.context-attestation/v0]

    RenderAttestation:
      type: object
      description: >
        WAVE Render Attestation v1 — the subject payload carried inside an `Attestation`
        envelope for `kind: render`. Attests that a specific renderer produced a specific
        output from a specific scene. The content-addressed envelope ID is derived from
        the canonical serialization of these fields (see `attestation/ATTESTATION-STANDARD-v1.md`).
      required:
        [v, kind, renderer, scene_sha256, output_sha256, format, bytes]
      properties:
        v:
          type: string
          maxLength: 64
          description: Version string. Equals the outer envelope `v` field.
          examples: ['wave.render-attestation/v1']
        kind:
          type: string
          const: render
          description: Always `"render"` for this payload type.
        renderer:
          type: string
          description: >
            Renderer identifier in `name@version/runtime` format, e.g.
            `wave-video@0.3.0/kernel`. Used to identify which build produced the output.
        scene_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 hex of the canonical scene input (the Brief or Scene IR).
        output_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 hex of the rendered output bytes.
        format:
          type: string
          enum: [mp4, alpha]
          description: Output container/codec family.
        bytes:
          type: integer
          minimum: 0
          description: Byte length of the rendered output.

    WaveAttestation:
      description: >
        Top-level wire envelope for any WAVE Attestation v1. Carried as the
        `wave.attestation` OTLP span attribute (JSON string) and stored in the
        `observability.attestation` table. The `id` is content-addressed:
        `sha256hex(canonicalJson(attestationSubject(envelope)))`.
        Invariant: `alg === "none"` ⟺ `sig === null`.
        See `attestation/ATTESTATION-STANDARD-v1.md` for the normative specification.
      type: object
      required: [id, kind, v, subject, alg]
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >
            Content-addressed ID: `sha256hex(canonicalJson(attestationSubject(envelope)))`.
            Stable across cache replays; upserts are idempotent by this key.
        kind:
          type: string
          enum: [render, context, settlement]
          description: Attestation kind.
        v:
          type: string
          maxLength: 64
          description: Version string, e.g. `wave.render-attestation/v1`.
        subject:
          type: object
          description: "Kind-specific payload. For `kind: render`, see `RenderAttestation`."
          additionalProperties: true
        alg:
          type: string
          maxLength: 32
          description: Signature algorithm. `"ed25519"` or `"none"`.
          examples: [ed25519, none]
        sig:
          type: [string, 'null']
          maxLength: 2048
          description: >
            Base64url-encoded Ed25519 signature over `canonicalJson(subject)` bytes.
            `null` when `alg` is `"none"`.
        created:
          oneOf:
            - type: integer
              description: Unix seconds.
            - type: string
              maxLength: 40
              description: ISO 8601 timestamp or unix seconds as string.
          description: When the attestation was minted.
      allOf:
        - if:
            properties:
              alg: {const: none}
          then:
            properties:
              sig: {type: 'null'}
          else:
            required: [sig]
            properties:
              sig: {type: string}


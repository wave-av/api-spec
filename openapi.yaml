        preview_camera_index:
          type: [integer, 'null']
        last_transition:
          type: [string, 'null']
        overlays:
          type: object
          additionalProperties: true
        settings:
          type: object
          additionalProperties: true
        started_at:
          type: [string, 'null']
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateProductionRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        layout:
          type: string
          enum: [single, split, pip, grid, custom]
          default: single
        stream_ids:
          type: array
          items:
            type: string
        record:
          type: boolean
          default: false

    SwitchCameraRequest:
      type: object
      required: [cameraIndex, bus]
      properties:
        cameraIndex:
          type: integer

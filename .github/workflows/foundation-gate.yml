# foundation-gate.yml — calls the INLINED checks at ./.github/workflows/_checks.yml.
#
# WHY INLINED: this repo is PUBLIC; wave-av/wave-foundation is PRIVATE. GitHub Actions does
# NOT permit a public repo to consume a private repo's reusable workflow — the call fails in
# 0s with 0 jobs (workflow_run never starts). `_checks.yml` mirrors
# wave-foundation/.github/workflows/checks.yml@v1. Keep them in sync on every v1.x bump (no
# consume-not-copy here; the consume path is structurally impossible for a public repo).
#
# Required check name ("gate / checks") resolves from the outer job "gate" + the inner job
# name "checks" in `_checks.yml` — same shape branch protection has been requiring all along.

name: foundation-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/_checks.yml
    with:
      max_lines: 800

  # The spec IS the product here — this repo's whole output is openapi.yaml, and every SDK and
  # the CLI are generated from it. Until now nothing validated it, so `main` carried 2 lint
  # ERRORS undetected: an unquoted YAML flow mapping whose commas split the value into junk
  # keys, silently corrupting a schema that every generated SDK inherited. A spec defect is a
  # fleet-wide defect, so it gets a gate.
  #
  # Errors fail the build; the 53 pre-existing warnings do not (redocly exits non-zero only on
  # errors). Tighten to warnings once the backlog is worked down.
  spec-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Lint openapi.yaml (fail on errors)
        run: npx --yes @redocly/cli@2.40.0 lint openapi.yaml
      - name: Assert every internal $ref resolves
        # redocly catches structural problems; this catches a dangling '#/components/...' that
        # a hand-edit introduced. Cheap, and it is the other half of "the spec is loadable".
        #
        # js-yaml is installed explicitly rather than leaned on transitively: `npx @redocly/cli`
        # resolves in its own temp prefix, so nothing it depends on is importable from this repo.
        run: |
          npm install --no-save --no-audit --no-fund js-yaml@4.1.0
          node .github/scripts/assert-refs.mjs openapi.yaml

  # The spec is the source of truth for every generated SDK and the CLI. These two gates make
  # sure the committed artifact stays honest:
  #   - sdk-types: the committed generated/types.d.ts must not drift from openapi.yaml (fail-on-diff)
  #   - breaking-change: the PR must not introduce breaking spec changes without an explicit
  #     "Breaking: yes" marker in the PR body (oasdiff compares PR head vs base branch)
  sdk-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Install tooling
        run: npm install --no-save --no-audit --no-fund openapi-typescript@7.13.0
      - name: Regenerate types and fail if the committed artifact drifted
        run: |
          npx openapi-typescript openapi.yaml -o generated/api-types.d.ts
          git diff --exit-code -- generated/api-types.d.ts
      - name: Confirm the committed artifact is present and non-empty
        run: test -s generated/api-types.d.ts

  breaking-change:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only PRs can break the contract; the base branch is the comparison target.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Extract base branch spec
        run: |
          mkdir -p /tmp/base
          git show "origin/${{ github.event.pull_request.base.ref }}:openapi.yaml" > /tmp/base/openapi.yaml
          test -s /tmp/base/openapi.yaml
      - name: Fail on unacknowledged breaking changes
        # oasdiff breaking --fail-on ERR exits 1 when the PR's openapi.yaml has breaking
        # changes vs the base branch (removed/renamed paths, removed required params, etc).
        # Breaking changes are allowed only with an explicit "Breaking: yes" marker in the
        # PR body — that is a deliberate, acknowledged contract break (version bump + notice).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if docker run --rm -v /tmp/base:/base:ro -v "$PWD":/spec:ro ghcr.io/tufin/oasdiff:latest \
               breaking --fail-on ERR /base/openapi.yaml /spec/openapi.yaml > /tmp/oasdiff.txt 2>&1; then
            echo "No breaking spec changes."
          else
            if gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
                --json body --jq '.body' | grep -q "Breaking: yes"; then
              echo "::warning::Breaking spec changes acknowledged via 'Breaking: yes' marker."
              cat /tmp/oasdiff.txt
            else
              echo "::error::Breaking spec changes detected. Acknowledge them with 'Breaking: yes' in the PR body."
              cat /tmp/oasdiff.txt
              exit 1
            fi
          fi

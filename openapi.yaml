openapi: 3.1.0
info:
  title: WAVE Enterprise Streaming Platform API
  description: |
    Complete API reference for WAVE Enterprise Streaming Platform.

    ## Authentication
    All API requests require a Bearer token in the Authorization header:
    ```
    Authorization: Bearer YOUR_API_KEY
    ```

    ## Rate Limiting
    API requests are rate limited. When rate limited, you'll receive a 429 response
    with a `Retry-After` header indicating when to retry.

    ## Pagination
    List endpoints support pagination via `page` and `perPage` query parameters.
    Responses include pagination metadata.

    ## Errors
    All errors return the normalized WAVE envelope `{ "error": { "code", "message" } }`,
    optionally enriched with `details`, `suggestions`, `did_you_mean`, and `doc_url`.
  version: 1.0.0
  contact:
    name: WAVE Developer Support
    url: https://wave.online/developers
    email: developers@wave.online
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: https://api.wave.online/v1
    description: Production API

security:
  - BearerAuth: []

tags:
  - name: Clips
    description: AI-powered highlight detection and clip management
  - name: Voice
    description: Text-to-speech synthesis and voice cloning
  - name: Captions
    description: Auto-captioning and multi-language translation
  - name: Chapters
    description: AI chapter detection and video segmentation
  - name: Editor
    description: Cloud video editing projects
  - name: Phone
    description: VoIP phone lines and call management
  - name: Collab
    description: Real-time collaboration rooms
  - name: Podcast
    description: Podcast show and episode management
  - name: Studio AI
    description: Video enhancement and AI processing
  - name: Transcribe
    description: Speech-to-text transcription
  - name: Sentiment
    description: Sentiment and emotion analysis
  - name: Search
    description: Semantic content search
  - name: Realtime
    description: >-
      Live control & event plane — presence, pub/sub broadcast, and the streaming-event bus the WAVE
      AI products push into. Served at realtime.wave.online (not the api host); subscribe over one
      WebSocket, producers publish over REST. Auth federates to the gateway.
  - name: AV Mux/Demux
    description: >-
      Synchronous container-transform for local IP video + Dante/AES67 audio: mux separate RTP H.264
      video and Dante audio into one sync-locked MPEG-TS or fMP4 stream, and demux the inverse. x402
      metered per minute (`wave_av_minutes`) plus per transform-second (`wave_av_transform_seconds`).
  - name: Enhance
    description: >-
      AI video super-resolution. v1 ships one model, `espcn` (ESPCN, a fixed exact 3x upscale) —
      unrecognized `model` values 400. Requires the `enhance:write` entitlement; x402-payable
      per-output-minute (`wave_enhance_minutes`, rounded up to the nearest minute of rendered
      output duration).
  - name: Braided Audio
    description: >-
      On-demand WAVE Braided Audio publish — mixes multiple named audio sources into one
      MoQ-native braided track (single interleaved multichannel stream, not N independent
      streams). Requires the `moq:write` entitlement. Publishing spins up an on-demand machine;
      the same namespace can be republished (replacing the prior machine) or explicitly stopped.
  - name: MoQ
    description: >-
      Media over QUIC join-token mint — the only HTTP surface of the MoQ product. These two
      endpoints authorize the caller on the api host and return a short-lived signed join-token
      plus the relay URL to connect to; media never transits the API gateway, because the client
      opens the MoQ session DIRECTLY to the relay at moq.wave.online carrying that token. The media
      session itself is not an HTTP surface and is deliberately not modelled in this document: it
      is the IETF Media over QUIC Transport protocol (control + object frames over WebTransport /
      QUIC, with a WebSocket fallback for browsers that cannot open a raw QUIC session). To use it,
      point a MoQ client at `relayWsUrl` and pass the token as the `join` query parameter (browser
      WebSocket clients cannot set request headers) or, server-to-server, as the `x-wave-moq-join`
      request header — SDK clients mint the token; carrying it over the wire is the MoQ client's
      job. DRAFT VERSION: this surface corresponds to draft-ietf-moq-transport-18
      (https://datatracker.ietf.org/doc/draft-ietf-moq-transport/18/), which is what the WAVE relay
      currently speaks (preferred draft-18, negotiating draft-07..draft-18 over ALPN). draft-19 was
      published 2026-07-06 and is NOT yet deployed; adopting it is tracked in wave-moq-edge#114.
      The join-token mint is transport-version independent — a draft bump changes the wire session,
      not this HTTP contract.

  - name: Render
    description: >-
      Code-defined video — render a branded, deterministic MP4 (or alpha ProRes) from a typed
      Brief. Pay-per-render over x402 (no signup); the payment proof is the identity. The same
      Brief renders to the same bytes on any host. Reference renderer is source-available (BSL).
paths:
  # Render API
  /render:
    post:
      tags: [Render]
      summary: Render a video from a Brief (x402-payable)
      operationId: renderVideo
      description: >-
        POST a typed Brief. Unpaid → 402 with a `WWW-Authenticate` x402 challenge; pay and retry.
        A bad brief → 400 before any charge. Paid → 200: the binary `video/mp4` by default, or a
        RenderResult envelope when you send `Accept: application/json` (always for 4K / alpha,
        delivered via a signed, expiring URL). Deterministic within a renderer version; `sha256`
        is the determinism receipt (also on the `x-wave-sha256` header).
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: A replayed key returns the original result without re-charging.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderBrief'
      responses:
        '200':
          description: The rendered video — binary, or a RenderResult envelope under Accept application/json.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/RenderResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '402':
          description: Payment required — pay the x402 challenge and retry.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: The x402 challenge, including the quoted price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Output too large to return inline and no hosted delivery configured (OUTPUT_TOO_LARGE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '451':
          description: Content is on the operator deny/takedown list and will not be rendered (CONTENT_BLOCKED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /render/{jobId}:
    get:
      tags: [Render]
      summary: Poll an async render job
      operationId: renderPoll
      description: >-
        Fetch the current state of a render started asynchronously. Terminal states carry the
        delivery URL and the determinism receipt; poll until `status` is `done` or `error`.
        Prefer `/render/{jobId}/events` when you can hold a connection — it delivers the same
        frames without a polling loop.
      security: []
      parameters:
        - $ref: '#/components/parameters/RenderJobIdParam'
      responses:
        '200':
          description: The job view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderJobView'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          description: >-
            Job status temporarily unavailable — the job store did not answer. This is
            retryable and does NOT mean the job failed; back off and poll again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /render/{jobId}/events:
    get:
      tags: [Render]
      summary: Subscribe to an async render job (SSE)
      operationId: renderEvents
      description: >-
        Server-Sent Events stream of `RenderJobView` frames for a render job. One frame per state
        transition; the stream closes once the job reaches a terminal state (`done` or `error`).
        The final frame is identical to what `GET /render/{jobId}` would return at that moment.
      security: []
      parameters:
        - $ref: '#/components/parameters/RenderJobIdParam'
      responses:
        '200':
          description: SSE stream of RenderJobView frames.
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  An SSE stream. Each `data:` line is a JSON-encoded `RenderJobView`.
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  # Clips API
  /clips:
    get:
      tags: [Clips]
      summary: List clips
      operationId: listClips
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: videoId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of clips
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Clip'
    post:
      tags: [Clips]
      summary: Create a clip
      operationId: createClip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipCreate'
      responses:
        '201':
          description: Clip created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clip'
        '400':
          $ref: '#/components/responses/ValidationError'

  /clips/{clipId}:
    get:
      tags: [Clips]
      summary: Get a clip
      operationId: getClip
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Clip details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clip'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [Clips]
      summary: Update a clip
      operationId: updateClip
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipUpdate'
      responses:
        '200':
          description: Clip updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clip'
    delete:
      tags: [Clips]
      summary: Delete a clip
      operationId: deleteClip
      parameters:
        - name: clipId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Clip deleted

  /clips/detect:
    post:
      tags: [Clips]
      summary: Start AI clip detection
      operationId: detectClips
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipDetectRequest'
      responses:
        '202':
          description: Detection job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionJob'

  # Voice API
  /voice/voices:
    get:
      tags: [Voice]
      summary: List available voices
      operationId: listVoices
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [premade, cloned, professional]
        - name: language
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of voices
          content:
            application/json:
              schema:
                type: object
                properties:
                  voices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Voice'

  /voice/generate:
    post:
      tags: [Voice]
      summary: Generate speech from text
      operationId: generateSpeech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceGenerateRequest'
      responses:
        '200':
          description: >
            Speech generated. The gateway returns one of three shapes depending on
            the engine path: an inline JSON payload with base64 audio + character
            `alignment` (single round-trip, carries word timestamps), an async job
            to poll, or raw audio bytes when timestamps were not requested.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/VoiceSynthesisInline'
                  - $ref: '#/components/schemas/VoiceGeneration'
            audio/mpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '502':
          $ref: '#/components/responses/UpstreamError'

  /voice/clone:
    post:
      tags: [Voice]
      summary: Clone a voice from audio samples
      operationId: cloneVoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceCloneRequest'
      responses:
        '201':
          description: Voice cloned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Voice'

  # Captions API
  /captions:
    get:
      tags: [Captions]
      summary: List caption jobs
      operationId: listCaptions
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: videoId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/JobStatus'
      responses:
        '200':
          description: Paginated list of caption jobs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CaptionJob'
    post:
      tags: [Captions]
      summary: Create a caption job
      operationId: createCaptionJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptionJobCreate'
      responses:
        '201':
          description: Caption job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptionJob'

  /captions/{jobId}:
    get:
      tags: [Captions]
      summary: Get a caption job
      operationId: getCaptionJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Caption job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptionJob'
    delete:
      tags: [Captions]
      summary: Delete a caption job
      operationId: deleteCaptionJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Caption job deleted

  /captions/{jobId}/download:
    get:
      tags: [Captions]
      summary: Download captions
      operationId: downloadCaptions
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
        - name: language
          in: query
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [srt, vtt, txt, json]
            default: srt
      responses:
        '200':
          description: Caption download
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
                  content:
                    type: string

  # Chapters API
  /videos/{videoId}/chapters:
    get:
      tags: [Chapters]
      summary: List chapters for a video
      operationId: listChapters
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of chapters
          content:
            application/json:
              schema:
                type: object
                properties:
                  chapters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Chapter'
    post:
      tags: [Chapters]
      summary: Create a chapter
      operationId: createChapter
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterCreate'
      responses:
        '201':
          description: Chapter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Chapter'

  /videos/{videoId}/chapters/detect:
    post:
      tags: [Chapters]
      summary: Start AI chapter detection
      operationId: detectChapters
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterDetectRequest'
      responses:
        '202':
          description: Detection job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectionJob'

  # Editor API
  /editor/projects:
    get:
      tags: [Editor]
      summary: List editor projects
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/EditorProject'
    post:
      tags: [Editor]
      summary: Create an editor project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditorProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorProject'

  /editor/projects/{projectId}:
    get:
      tags: [Editor]
      summary: Get a project
      operationId: getProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorProject'
    patch:
      tags: [Editor]
      summary: Update a project
      operationId: updateProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditorProjectUpdate'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditorProject'
    delete:
      tags: [Editor]
      summary: Delete a project
      operationId: deleteProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Project deleted

  /editor/projects/{projectId}/export:
    post:
      tags: [Editor]
      summary: Export a project
      operationId: exportProject
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '202':
          description: Export started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJob'

  # Phone API
  /phone/lines:
    get:
      tags: [Phone]
      summary: List phone lines
      operationId: listPhoneLines
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated list of phone lines
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PhoneLine'
    post:
      tags: [Phone]
      summary: Provision a phone line
      operationId: provisionPhoneLine
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneLineProvision'
      responses:
        '201':
          description: Phone line provisioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneLine'

  /phone/calls:
    get:
      tags: [Phone]
      summary: List calls
      operationId: listCalls
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: lineId
          in: query
          schema:
            type: string
        - name: direction
          in: query
          schema:
            type: string
            enum: [inbound, outbound]
      responses:
        '200':
          description: Paginated list of calls
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Call'
    post:
      tags: [Phone]
      summary: Make a call
      operationId: makeCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallCreate'
      responses:
        '201':
          description: Call initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Call'

  # Collab API
  /collab/rooms:
    get:
      tags: [Collab]
      summary: List collaboration rooms
      operationId: listCollabRooms
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          schema:
            type: string
            enum: [waiting, active, ended]
      responses:
        '200':
          description: Paginated list of rooms
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CollabRoom'
    post:
      tags: [Collab]
      summary: Create a collaboration room
      operationId: createCollabRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollabRoomCreate'
      responses:
        '201':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabRoom'

  /collab/rooms/{roomId}:
    get:
      tags: [Collab]
      summary: Get a room
      operationId: getCollabRoom
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Room details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollabRoom'
    delete:
      tags: [Collab]
      summary: Delete a room
      operationId: deleteCollabRoom
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Room deleted

  # Podcast API
  /podcast/shows:
    get:
      tags: [Podcast]
      summary: List podcast shows
      operationId: listPodcastShows
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      responses:
        '200':
          description: Paginated list of shows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PodcastShow'
    post:
      tags: [Podcast]
      summary: Create a podcast show
      operationId: createPodcastShow
      requestBody:
        required: true
        content:
          application/json:
            schema:

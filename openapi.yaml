  # Search API — gateway-native hybrid search (wave-search). Replaces the archived monolith's
  # /search + /search/quick + /search/suggest + /search/semantic (the types/filters/page shape).
  /search:
    post:
      tags: [Search]
      summary: Hybrid search (dense + sparse → RRF) over streams/clips/transcripts, tenant-isolated
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Ranked results + metadata (metered wave_search_queries)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid request (bad body/query/namespace/topK)
        '429':
          description: Per-org rate limit exceeded
        '503':
          description: Search plane unconfigured

  /search/index:
    post:
      tags: [Search]
      summary: Index (upsert) one doc or a batch
      operationId: searchIndex
      requestBody:

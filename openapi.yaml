  - name: Agent Auth
    description: >-
      The OAuth Device Authorization Grant (RFC 8628) ceremony that lets a self-hosted
      agent or CLI act on a user's wallets: the agent requests a device code, the user
      approves once in a browser, then the agent holds tokens and signs with ephemeral
      keys — no app secret ever ships to the agent. These two routes are the
      pre-credential bootstrap (no Bearer token required; that is the point of the
      grant), served as a proxy over Privy's device authorization endpoints.

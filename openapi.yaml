          type: object
          properties:
            enabled:
              type: boolean
        privacy:
          type: string
          enum: [public, private]
          default: public
        metadata:
          type: object
          additionalProperties: true

    Highlight:
      type: object
      properties:
        id:
          type: string
        stream_id:
          type: string
        organization_id:
          type: string
        title:
          type: [string, 'null']
        settings:
          type: object
          additionalProperties: true
          description: '{label, timestamp, confidence, source}'
        created_at:
          type: string
          format: date-time

    ModerateRequest:
      type: object
      required: [content, contentType]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 50000
        contentType:
          type: string
          enum: [text, title, description, comment, chat, username, bio]
        context:
          type: object
          properties:
            streamId:
              type: string
            userId:
              type: string
            previousContent:
              type: array
              items:
                type: string
          description: streamId attributes the moderated content to a stream (e.g. a chat message).
        options:
          type: object
          properties:
            returnDetails:
              type: boolean
              default: true
            categories:
              type: array
              items:
                type: string
              description: >-
                Subset of harassment, hate_speech, violence, sexual_content, spam,
                misinformation, self_harm, illegal_activity, personal_information,
                copyright.
            customRules:
              type: array
              items:
                type: object
                required: [name, pattern, action]
                properties:
                  name:
                    type: string
                  pattern:
                    type: string
                    description: A regular expression evaluated against content.
                  action:
                    type: string
                    enum: [flag, block]

    ModerateResponse:
      type: object
      properties:
        allowed:
          type: boolean
        action:
          type: string
          enum: [allow, flag, block, review]
        violations:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
              severity:
                type: string
                enum: [low, medium, high, critical]
              confidence:
                type: number
              description:
                type: string
              matchedText:
                type: string
              rule:
                type: string
        confidence:
          type: number
        reasoning:
          type: string
        suggestedAction:
          type: string
        metadata:
          type: object
          properties:
            contentId:
              type: string
            processingTimeMs:
              type: integer
            model:
              type: string
            categoriesChecked:
              type: array
              items:
                type: string

    Production:
      type: object
      properties:
        id:
          type: string
        organization_id:
          type: string
        user_id:
          type: [string, 'null']
        title:
          type: string
        description:
          type: [string, 'null']
        status:
          type: string
          enum: [setup, rehearsal, live, paused, ended]
        layout:
          type: string
          enum: [single, split, pip, grid, custom]
        stream_ids:
          type: array
          items:

            application/json:
              schema:
                $ref: '#/components/schemas/Production'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /productions/{productionId}:
    get:
      tags: [Productions]
      summary: Get a production
      description: Requires the `productions:read` scope.
      operationId: getProduction
      parameters:
        - $ref: '#/components/parameters/ProductionIdParam'
      responses:
        '200':
          description: Production details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Production'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /productions/{productionId}/camera:
    post:
      tags: [Productions]
      summary: Switch a production's camera
      description: >-
        Switch the program or preview bus to a camera index; persisted on the
        production row. Requires the `productions:write` scope.
      operationId: switchProductionCamera
      parameters:
        - $ref: '#/components/parameters/ProductionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchCameraRequest'
      responses:
        '200':
          description: Camera switched
          content:
            application/json:
              schema:
                type: object
                properties:
                  productionId:
                    type: string
                  bus:
                    type: string
                    enum: [program, preview]
                  cameraIndex:
                    type: integer
                  transition:
                    type: string
                    enum: [cut, dissolve, wipe, fade]
                  switchedAt:
                    type: string
                    format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /productions/{productionId}/overlay:
    post:
      tags: [Productions]
      summary: Show, hide, or update a production's graphic overlay
      description: >-
        Persists overlay state into the production's `overlays` map, keyed by
        `graphic_id`. Requires the `productions:write` scope.
      operationId: setProductionOverlay
      parameters:
        - $ref: '#/components/parameters/ProductionIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [graphic_id, action]
              properties:
                graphic_id:
                  type: string
                  minLength: 1
                  maxLength: 100
                action:
                  type: string
                  enum: [show, hide, update]
                data:
                  type: object
                  additionalProperties: true
                  description: Data bindings for the graphic template.
      responses:
        '200':
          description: Overlay state updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  productionId:
                    type: string
                  graphicId:
                    type: string
                  action:
                    type: string
                    enum: [show, hide, update]
                  data:
                    type: [object, 'null']
                    additionalProperties: true
                  updatedAt:
                    type: string
                    format: date-time
                  overlays:
                    type: object
                    additionalProperties: true
                    description: The production's full overlay map after this update.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Cameras
  /cameras:
    get:
      tags: [Cameras]
      summary: List registered cameras
      description: Requires the `cameras:read` scope.
      operationId: listCameras
      responses:
        '200':
          description: List of registered cameras
          content:
            application/json:
              schema:
                type: object
                properties:
                  cameras:
                    type: array
                    items:
                      $ref: '#/components/schemas/Camera'
                  total:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Cameras]
      summary: Register a camera
      description: Requires the `cameras:write` scope.
      operationId: registerCamera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCameraRequest'
      responses:
        '201':
          description: Camera registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /cameras/{cameraId}/control:
    post:
      tags: [Cameras]
      summary: Send a control command to a camera
      description: >-
        Queues a control command for a registered camera (`camera_commands`, status
        `queued`). There is no protocol-general hardware dispatcher at this layer
        yet — a follow-up dispatcher marks the command `acked` or `failed`; this
        call never fabricates an `acked` status for a command not yet delivered.
        Requires the `cameras:write` scope.
      operationId: controlCamera
      parameters:
        - $ref: '#/components/parameters/CameraIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlCameraRequest'
      responses:
        '200':
          description: Command queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  cameraId:
                    type: string
                  commandId:
                    type: string
                  command:
                    $ref: '#/components/schemas/ControlCameraRequest'
                  status:
                    type: string
                    enum: [queued, acked, failed]
        '400':
          description: Invalid or unrecognized control command.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Billing
  /billing:
    get:
      tags: [Billing]
      summary: Get the current billing account
      description: >-
        Returns the caller-org's billing status. An org with no Stripe customer yet
        returns `billingAccount: null` and `plan: "free"` rather than an error.
        Requires the `billing:read` scope.
      operationId: getBilling
      responses:
        '200':
          description: Billing account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /billing/usage:
    get:
      tags: [Billing]
      summary: Get billed usage for a date range
      description: >-
        Per-dimension billed usage, defaulting to the current billing period.
        Requires the `billing:read` scope.
      operationId: getBillingUsage
      parameters:
        - name: from
          in: query
          description: Range start (YYYY-MM-DD). Defaults to the start of the current month.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Range end (YYYY-MM-DD). Defaults to today.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Billed usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingUsageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Billing usage is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /usage:
    get:
      tags: [Billing]
      summary: Get raw per-dimension usage
      description: >-
        Raw per-dimension usage counters for a date range (defaults to today),
        keyed by meter dimension (e.g. `wave_braid_minutes`, `transcription_seconds`,
        `duration_ms:srt`) — the underlying meter ledger, not a billing-period
        rollup. See `GET /billing/usage` for the billed-and-priced view. Requires
        the `usage:read` scope.
      operationId: getUsage
      parameters:
        - name: from
          in: query
          description: Range start (YYYYMMDD). Defaults to today.
          schema:
            type: string
        - name: to
          in: query
          description: Range end (YYYYMMDD). Defaults to today.
          schema:
            type: string
      responses:
        '200':
          description: Raw usage totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  # Gateway-native root surfaces — NOT /v1 operations. Each carries its own `servers` override to
  # https://api.wave.online (no /v1 prefix) because the gateway serves these at the host root, now
  # operator/tenant-authenticated. Both were previously exempted in published-drift-allowlist.json
  # as undocumented-live while unauthenticated; that exemption's own justification names this the
  # intended remedy once each operation gained a security requirement.
  /leaderboard:
    get:
      tags: [Usage]
      summary: Your org's usage leaderboard (meters ranked by consumption) — API key + usage:read
      description: >-
        Tenant-scoped: rows are the calling org's own metered dimensions, ranked by billed usage
        over the window (`from`/`to` as YYYYMMDD, default trailing 7 days). The org is taken from
        the API key, never from the query string. Unauthenticated callers receive 401
        LEADERBOARD_AUTH_REQUIRED. The PUBLIC model-eval leaderboard is a different surface at
        https://leaderboard.wave.online/leaderboard (no key needed).
      operationId: getUsageLeaderboard
      servers:
        - url: https://api.wave.online
      security:
        - bearerWithScopes: [usage:read]
      externalDocs:
        description: Public model-eval leaderboard (measured rows only)
        url: https://leaderboard.wave.online/leaderboard
      responses:
        '200':
          description: '{ org, window:{from,to,days}, ranking:[{rank, meter, unit, used}] } — private, no-store'
        '401':
          description: LEADERBOARD_AUTH_REQUIRED — no or invalid API key; body names the public board's URL
        '403':
          description: SCOPE_DENIED — key lacks usage:read

  /platform:
    get:
      tags: [Operator]
      summary: Platform-wide live usage — OPERATOR ONLY (inference + voice + codec + storage + realtime + clips + captions)
      description: >-
        Operator-authenticated. Requires the WAVE service bearer; unauthenticated callers receive
        401 TELEMETRY_AUTH_REQUIRED.
      operationId: getPlatformUsage
      servers:
        - url: https://api.wave.online
      security:
        - bearerWithScopes: []
      responses:
        '200':
          description: Every product's live usage, grounded-only
        '401':
          description: 'Operator authentication required: {"error":{"code":"TELEMETRY_AUTH_REQUIRED"}}'


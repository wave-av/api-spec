# foundation-gate.yml — calls the INLINED checks at ./.github/workflows/_checks.yml.
#
# WHY INLINED: this repo is PUBLIC; wave-av/wave-foundation is PRIVATE. GitHub Actions does
# NOT permit a public repo to consume a private repo's reusable workflow — the call fails in
# 0s with 0 jobs (workflow_run never starts). `_checks.yml` mirrors
# wave-foundation/.github/workflows/checks.yml@v1. Keep them in sync on every v1.x bump (no
# consume-not-copy here; the consume path is structurally impossible for a public repo).
#
# Required check name ("gate / checks") resolves from the outer job "gate" + the inner job
# name "checks" in `_checks.yml` — same shape branch protection has been requiring all along.

name: foundation-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/_checks.yml
    with:
      max_lines: 800

  # The spec IS the product here — this repo's whole output is openapi.yaml, and every SDK and
  # the CLI are generated from it. Until now nothing validated it, so `main` carried 2 lint
  # ERRORS undetected: an unquoted YAML flow mapping whose commas split the value into junk
  # keys, silently corrupting a schema that every generated SDK inherited. A spec defect is a
  # fleet-wide defect, so it gets a gate.
  #
  # Errors fail the build; the 53 pre-existing warnings do not (redocly exits non-zero only on
  # errors). Tighten to warnings once the backlog is worked down.
  spec-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Install pinned tooling from lockfile
        # package.json pins the direct tools by exact version and package-lock.json pins the
        # full transitive tree, so npm ci is byte-reproducible across CI and local runs.
        # --ignore-scripts stops install lifecycle hooks from executing (none of these tools
        # needs one).
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Lint openapi.yaml (fail on errors)
        run: npm run lint
      - name: Assert every internal $ref resolves
        # redocly catches structural problems; this catches a dangling '#/components/...' that
        # a hand-edit introduced. Cheap, and it is the other half of "the spec is loadable".
        run: node .github/scripts/assert-refs.mjs openapi.yaml

  # The spec is the source of truth for every generated SDK and the CLI. These two gates make
  # sure the committed artifact stays honest:
  #   - sdk-types: the committed generated/types.d.ts must not drift from openapi.yaml (fail-on-diff)
  #   - breaking-change: the PR must not introduce breaking spec changes without an explicit
  #     "Breaking: yes" marker in the PR body (oasdiff compares PR head vs base branch)
  sdk-types:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - name: Install pinned tooling from lockfile
        # Same reproducible install as spec-lint: npm ci from the committed lockfile,
        # --ignore-scripts as above.
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Regenerate types and fail if the committed artifact drifted
        # ls-files guards against a PR deleting the committed artifact: a regenerated file
        # would be untracked, and `git diff` ignores untracked paths, so the drift check
        # would silently pass. --intent-to-add makes any untracked output visible to diff.
        run: |
          git ls-files --error-unmatch generated/api-types.d.ts
          npm run gen:types
          git add --intent-to-add generated/api-types.d.ts
          git diff --exit-code -- generated/api-types.d.ts
      - name: Confirm the committed artifact is present and non-empty
        run: test -s generated/api-types.d.ts

  breaking-change:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only PRs can break the contract; the base branch is the comparison target.
    if: github.event_name == 'pull_request'
    # Job-level grant: `gh pr view` needs pull-requests: read, which the workflow-level
    # block (contents: read only) does not include. Job-level permissions replace the
    # workflow-level block entirely, so contents: read is restated for checkout.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Extract base branch spec
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p /tmp/base
          git show "origin/${BASE_REF}:openapi.yaml" > /tmp/base/openapi.yaml
          test -s /tmp/base/openapi.yaml
      - name: Fail on unacknowledged breaking changes
        # oasdiff breaking --fail-on ERR exits 1 when the PR's openapi.yaml has breaking
        # changes vs the base branch (removed/renamed paths, removed required params, etc).
        # Breaking changes are allowed only with an explicit "Breaking: yes" marker in the
        # PR body — that is a deliberate, acknowledged contract break (version bump + notice).
        #
        # The image is pinned by tag + digest (repo convention: actions by SHA, npm by exact
        # version). Note the image lives on Docker Hub; ghcr.io hosts no oasdiff `latest`.
        # Exit codes are handled explicitly so infra failures (image pull, spec parse) surface
        # as errors instead of masquerading as a contract break. Verified against this exact
        # image: 0 = no breaking changes, 1 = breaking changes (never overloaded for errors),
        # 100 = usage error, 102 = spec load/parse failure, 125 = docker-side failure.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          rc=0
          docker run --rm -v /tmp/base:/base:ro -v "$PWD":/spec:ro \
            tufin/oasdiff:v1.28.0@sha256:86830f988eaafcf589acb2794ee5ab78e3300ded071d6517bf085469300cbf36 \
            breaking --fail-on ERR /base/openapi.yaml /spec/openapi.yaml > /tmp/oasdiff.txt 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "No breaking spec changes."
          elif [ "$rc" -eq 1 ]; then
            if ! PR_BODY=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body'); then
              echo "::error::Could not fetch the PR body to check for the 'Breaking: yes' marker; failing rather than guessing."
              exit 1
            fi
            if grep -q "Breaking: yes" <<< "$PR_BODY"; then
              echo "::warning::Breaking spec changes acknowledged via 'Breaking: yes' marker."
              cat /tmp/oasdiff.txt
            else
              echo "::error::Breaking spec changes detected. Acknowledge them with 'Breaking: yes' in the PR body."
              cat /tmp/oasdiff.txt
              exit 1
            fi
          else
            echo "::error::oasdiff did not produce a verdict (exit $rc): infrastructure or spec-parse failure, not a contract break."
            cat /tmp/oasdiff.txt
            exit "$rc"
          fi

                $ref: '#/components/schemas/SearchAnalyticsResponse'

  # Realtime API — served at realtime.wave.online (per-operation server override). WebSocket subscribe
  # is documented descriptively (OpenAPI has no native WS); REST publish/presence/history are first-class.
  /realtime/connect:
    get:
      tags: [Realtime]
      summary: Subscribe to a channel (WebSocket)
      operationId: realtimeConnect
      description: >-
        Open a WebSocket to subscribe to a channel. This is a WebSocket upgrade (HTTP 101), not a normal
        GET — clients send `Upgrade: websocket`. Browser/SDK clients that cannot set headers may pass the
        key as `?access_token=`. On connect the server sends a `welcome` frame (current presence +
        recent history), then live frames: `message` (a published event), `join`/`leave` (presence),
        `presence` (full list). The real path is `/v1/connect?channel=<id>`.
      servers:
        - url: https://realtime.wave.online
          description: WAVE Realtime edge
      parameters:
        - name: channel
          in: query
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9:_-]{0,127}$' }
          description: Namespaced channel id, e.g. `stream:abc`, `room:xyz`.
        - name: as
          in: query
          required: false
          schema: { type: string }
          description: Member id to present as (defaults to the caller's key prefix).
      responses:
        '101':
          description: Switching Protocols — WebSocket established.
        '401': { description: Authentication required }
        '426': { description: Upgrade required (not a WebSocket request) }
  /realtime/channels/{channel}/publish:
    post:
      tags: [Realtime]
      summary: Publish an event to a channel
      operationId: realtimePublish
      description: Producer endpoint — publish one event to every subscriber of a channel. The real path is `/v1/channels/{channel}/publish`.
      servers:
        - url: https://realtime.wave.online
          description: WAVE Realtime edge
      parameters:
        - name: channel
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event:
                  type: string
                  description: Event name, e.g. `caption.cue`, `sentiment.tick`, `clip.created`, `stream.started`.
                data:
                  description: Arbitrary JSON payload for the event.
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  delivered: { type: integer, description: Number of subscribers the event reached }
        '401': { description: Authentication required }
  /realtime/channels/{channel}/presence:
    get:
      tags: [Realtime]
      summary: Current presence for a channel
      operationId: realtimePresence
      description: The real path is `/v1/channels/{channel}/presence`.
      servers:
        - url: https://realtime.wave.online
          description: WAVE Realtime edge
      parameters:
        - name: channel
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Presence list
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel: { type: string }
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
  /realtime/channels/{channel}/history:
    get:
      tags: [Realtime]
      summary: Recent event history for a channel
      operationId: realtimeHistory
      description: Last-N events (≤50). The real path is `/v1/channels/{channel}/history`.
      servers:
        - url: https://realtime.wave.online
          description: WAVE Realtime edge
      parameters:
        - name: channel
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, maximum: 50 }
      responses:
        '200':
          description: Recent events
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel: { type: string }
                  events:
                    type: array
                    items: { type: object }

  # Braided Audio API
  /braid/publish:
    post:
      tags: [Braided Audio]
      summary: Publish a braided audio track
      operationId: publishBraidAudio
      description: >-
        Starts (or replaces) an on-demand braid publisher for `ns`, mixing `sources` into one
        interleaved multichannel MoQ track. Requires the `moq:write` entitlement. If a machine is
        already live for this `org`/`ns`, it is torn down and replaced. Subject to per-org
        concurrency and creation-rate limits (429 `QUOTA_EXCEEDED` when exceeded).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BraidPublishRequest'
      responses:
        '201':
          description: Braid machine starting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BraidPublishResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Per-org concurrency or creation-rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Braid publish unavailable — the worker is not provisioned for on-demand publish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /braid/publish/{ns}:
    delete:
      tags: [Braided Audio]
      summary: Stop a braided audio publish
      operationId: stopBraidAudio
      description: >-
        Explicit early stop for a live braid machine in this namespace. Requires the `moq:write`
        entitlement. Tears down the machine via the same path `publishBraidAudio`'s replace
        action uses, so usage accounting is always consistent.
      parameters:
        - name: ns
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Braid machine stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BraidStopResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No live braid machine for this namespace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Braid publish unavailable — the worker is not provisioned for on-demand publish.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # AV Mux/Demux API — synchronous container-transform path (RTP H.264 video + Dante/AES67 audio).
  /av/remux:
    post:
      tags: [AV Mux/Demux]
      summary: Mux synchronized IP video + Dante audio into one container
      operationId: avRemux
      description: >-
        Synchronizes local IP video (RTP H.264) and separate Dante/AES67 audio into one sync-locked
        container stream (MPEG-TS or fMP4). Requires the `av:write` entitlement. x402-gated; billed
        per-minute (`wave_av_minutes`) plus per transform-second (`wave_av_transform_seconds`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvRemuxRequest'
      responses:
        '200':
          description: Muxed container stream — binary, or an AvTransformResult envelope under Accept application/json.
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/AvTransformResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '402':
          description: Payment required — pay the x402 challenge and retry.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: The x402 challenge, including the quoted price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: AV mux/demux unavailable — the spoke is not provisioned (AV_ORIGIN unset).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /av/demux:
    post:
      tags: [AV Mux/Demux]
      summary: Demux one container back into separate video + Dante audio
      operationId: avDemux
      description: >-
        Inverse of `/av/remux` — splits a synchronized MPEG-TS/fMP4 container back into local IP video
        (RTP H.264 out) and Dante/AES67 audio out, preserving sub-millisecond sync. Requires the
        `av:write` entitlement. x402-gated; billed per-minute (`wave_av_minutes`) plus per
        transform-second (`wave_av_transform_seconds`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvDemuxRequest'
      responses:
        '200':
          description: Demux result — routed IP-video + Dante sink status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvTransformResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '402':
          description: Payment required — pay the x402 challenge and retry.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: The x402 challenge, including the quoted price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: AV mux/demux unavailable — the spoke is not provisioned (AV_ORIGIN unset).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # MoQ API — join-token mint. The media session runs DIRECT to the relay (see the MoQ tag).
  /moq/publish/{ns}/{track}:
    post:
      tags: [MoQ]
      summary: Mint a MoQ publish join-token
      operationId: mintMoqPublishToken
      description: >-
        Authorizes the caller to PUBLISH to `ns`/`track` and returns a short-lived signed join-token
        (`role: publish`, `scope: moq:write`) plus the `relayWsUrl` to connect to. Requires the
        `moq:write` scope. The token is a bearer credential valid for `expiresIn` seconds — mint one
        per session immediately before connecting; do not cache or log it (the response is served
        `cache-control: no-store`). The durable API key never leaves the client. A publisher may
        declare the origin protocol of the stream it is about to publish with the
        `x-wave-declare-protocol` header so usage is billed against that protocol dimension. The
        declaration is only honoured on this publish leg, only for a recognized protocol, and only
        for orgs the operator has allowlisted; an unrecognized or unauthorized value is silently
        ignored and the session bills as plain `moq` — it never fails the mint.
      parameters:
        - $ref: '#/components/parameters/MoqNamespaceParam'
        - $ref: '#/components/parameters/MoqTrackParam'
        - name: x-wave-declare-protocol
          in: header
          required: false
          schema:
            type: string
          description: >-
            Optional declared origin protocol for billing (e.g. `moq`). Ignored unless recognized and
            authorized for this org; never rejects the mint.
      responses:
        '200':
          description: >-
            Join-token minted. Served `cache-control: no-store` — never cache or log `joinToken`.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store` — the response carries a short-lived bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoqJoinToken'
        '400':
          description: >-
            `MOQ_JOIN_BAD_RESOURCE` — `ns` or `track` does not match `^[a-z0-9-]{1,64}$`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          $ref: '#/components/responses/MoqJoinUnconfigured'

  /moq/subscribe/{ns}/{track}:
    get:
      tags: [MoQ]
      summary: Mint a MoQ subscribe join-token
      operationId: mintMoqSubscribeToken
      description: >-
        Authorizes the caller to SUBSCRIBE to `ns`/`track` and returns a short-lived signed
        join-token (`role: subscribe`, `scope: moq:read`) plus the `relayWsUrl` to connect to.
        Requires the `moq:read` scope. Least-privilege: a subscribe token grants read only — it
        cannot be replayed to publish, and the relay re-checks the signed `ns`/`track` against the
        session it is actually opening, so a token is bound to exactly one resource.
      parameters:
        - $ref: '#/components/parameters/MoqNamespaceParam'
        - $ref: '#/components/parameters/MoqTrackParam'
      responses:
        '200':
          description: >-
            Join-token minted. Served `cache-control: no-store` — never cache or log `joinToken`.
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store` — the response carries a short-lived bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoqJoinToken'
        '400':
          description: >-
            `MOQ_JOIN_BAD_RESOURCE` — `ns` or `track` does not match `^[a-z0-9-]{1,64}$`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          $ref: '#/components/responses/MoqJoinUnconfigured'

  /identity/resolve:
    get:
      tags: [Identity]
      summary: Resolve a WAVE agent id to its public channel map
      operationId: identityResolve
      description: |
        Gateway-native read pane. Returns the agent's public directory entry:
        email, credential key name (never a credential value), org, and channels. The data is
        public-directory data only.

        Tenancy is the authenticated principal; an optional `org` query param is a self-assertion
        that must match the principal (a mismatch is a 400 ORG_MISMATCH). Requires the
        `directory:read` scope (separately grantable; DISTINCT from the compliance `identity:read`
        scope that gates Stripe verification sessions).

        The one documented response variation is the `telephony` service entry, whose identity
        carries `org`/`channels`/`numbers`/`keys` (plural credential key names + E.164 numbers)
        instead of `email`/`key` — see the oneOf success schema.
      parameters:
        - name: agent
          in: query
          required: true
          description: Agent id (lowercase, e.g. `opencode`, `claude`, `telephony`)
          schema: { type: string, pattern: '^[a-z0-9-]{1,64}$' }
        - name: org
          in: query
          required: false
          description: Optional tenancy self-assertion; must equal the authenticated principal's org
          schema: { type: string }
      responses:
        '200':
          description: The resolved directory entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolveResponse'
        '400':
          description: Missing/bad agent id, or org self-assertion mismatch (MISSING_AGENT / BAD_AGENT / ORG_MISMATCH)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolveValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Well-formed but unknown agent id (UNKNOWN_AGENT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityResolveNotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /pricing/manifests:
    get:
      tags: [Pricing]
      summary: List the caller-org's pricing tier manifests
      operationId: pricingManifestsList
      description: |
        Gateway-native read (pricing-pages E0). Returns every pricing manifest the
        authenticated org has published, newest-first. Requires `pricing:read`.
        Org is the VALIDATED principal only — no cross-org reads.
      responses:
        '200':
          description: The org's manifests
          content:
            application/json:
              schema:
                type: object
                required: [org, manifests]
                properties:
                  org: { type: string }
                  manifests:
                    type: array
                    items: { $ref: '#/components/schemas/PricingManifest' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Pricing]
      summary: Validate + upsert the caller-org's tier manifest
      operationId: pricingManifestsCreate
      description: |
        Gateway-native write (pricing-pages E0). Validates the tier manifest against the
        rail law server-side and upserts it for the caller-org. Requires `pricing:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, tiers]
              properties:
                slug: { type: string }
                tiers: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200':
          description: The upserted manifest
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingManifest' }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /custody/{op}:
    post:
      tags: [Custody]
      summary: Held-fund capability operation (grant / revoke / inspect / exercise)
      operationId: custodyOperation
      description: |
        The money-engine custody surface (capability-custody). `op` is one of
        grant | revoke | inspect | exercise. Every operation is scoped to the
        authenticated principal's org; grants persist METADATA in the CapabilityAccount DO and
        the secret envelope ciphertext-only in KV (crypto-shreddable on revoke). Requires
        `custody:write` — deliberately NOT in UNIFORM_CUSTOMER_SCOPES (operator-plane).
      parameters:
        - name: op
          in: path
          required: true
          description: The custody operation
          schema: { type: string, enum: [grant, revoke, inspect, exercise] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grantId]
              properties:
                grantId: { type: string }
                provider: { type: string }
                scopes: { type: array, items: { type: string } }
                ttlSeconds: { type: number }
      responses:
        '200':
          description: The operation receipt (metadata only — never a secret field)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: CUSTODY_UNCONFIGURED — bindings/flag absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /engine/capabilities:
    get:
      tags: [Engine]
      summary: The media-engine capability contract
      operationId: engineCapabilities
      description: |
        Served through the WAVE gateway (engine:read). Returns the engine's capability
        JSON — the codecs/operations this deployment accepts.
      responses:
        '200':
          description: The capability contract
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /gpu/infer:
    post:
      tags: [Gpu]
      summary: Dispatch a GPU inference job on the WAVE-hosted GPU plane
      operationId: gpuInfer
      description: |
        The WAVE-hosted GPU inference plane (RunPod-backed). Requires `gpu:write`. Metered
        as wave_edge_gpu_hours, billed verbatim.
      requestBody:
        required: true
        content:
          application/json:
            schema:

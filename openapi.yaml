            a `label`/`track` and either a `url` or a `path`.
          items:
            type: object
            required: [label, track]
            properties:
              label:
                type: string
              track:
                type: string
              url:
                type: string
                format: uri
              path:
                type: string
        windowMs:
          type: integer
          description: Braid window size in milliseconds. Defaults to the machine-config default when omitted.
        sampleRate:
          type: integer
          description: Sample rate for the braided track. Defaults to the machine-config default when omitted.


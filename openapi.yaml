                last4:
                  type: string
                expMonth:
                  type: integer
                expYear:
                  type: integer
        plan:
          type: string
          description: '"free" when the org has no billing account.'
        subscription:
          type: [object, 'null']
          properties:
            id:
              type: string
            status:
              type: string
            currentPeriodEnd:
              type: integer
              description: Unix seconds.
            plan:
              type: [object, 'null']
              properties:
                priceId:
                  type: string
                unitAmount:
                  type: [integer, 'null']
                currency:
                  type: string
                interval:
                  type: [string, 'null']

    BillingUsageResponse:

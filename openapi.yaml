paths:
  /agent/auth/device:
    post:
      operationId: agentAuthDevice
      tags: [Agent Auth]
      security: []
      summary: Start the OAuth Device Authorization ceremony (RFC 8628)
      description: |
        The agent-auth bootstrap: an agent with no WAVE credential yet requests a device
        code, then a human approves wallet access in a browser once. Proxies Privy's
        device authorization endpoint; the app secret never reaches the agent, and every
        later wallet operation uses short-lived tokens plus an ephemeral signing key.

        The response carries `device_code` (secret, poll with it), `user_code` (short,
        human-readable), `verification_uri` (the approve URL), `verification_uri_complete`
        (the same URL with the user code prefilled - a page at `/agent/auth/verify` on the
        api host, no /v1 prefix), `expires_in` (seconds, 600), and `interval` (poll
        interval seconds, 5).

        A 403 means device authorization is not enabled for the app in the Privy
        dashboard - an operator action, not a caller error.
      responses:
        "200":
          description: The device grant (codes, verification URI, expiry, poll interval)
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
                properties:
                  device_code:
                    type: string
                  user_code:
                    type: string
                  verification_uri:
                    type: string
                    format: uri
                    description: The approve URL the human opens
                  verification_uri_complete:
                    type: string
                    format: uri
                    description: The same URL with the user code prefilled
                  expires_in:
                    type: integer
                    description: Seconds until the device code expires (600)
                  interval:
                    type: integer
                    description: Poll interval in seconds (5)
        "403":
          description: Device authorization not enabled for the app (dashboard toggle)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "502":
          description: Upstream auth endpoint unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Ceremony not configured on this deployment (no app id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /agent/auth/token:
    post:
      operationId: agentAuthToken
      tags: [Agent Auth]
      security: []
      summary: Poll for / refresh the ceremony tokens
      description: |
        Two grants, whitelisted exactly:
        `device_code` - poll with the device_code from the device endpoint at the given
        interval, with grant_type `urn:ietf:params:oauth:grant-type:device_code` (the
        registered RFC 8628 URN Privy's live token endpoint requires; bare `device_code`
        is also accepted at this seam). While approval is pending the upstream 400 body
        passes through verbatim (`authorization_pending`, `slow_down`, `expired_token`,
        `access_denied`) - these are the polling protocol, not failures to hide. On
        approval the response carries `access_token` and `refresh_token`.
        `refresh_token` - exchange a refresh token for a new access token; the old refresh
        token is invalidated immediately and a REPLACEMENT refresh_token is returned in
        the same response, so a client that stores it never loses its refresh credential.
        An absent refresh_token in a refresh response means the grant was revoked
        (or the token expired): restart the ceremony from the device endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: DeviceCodeGrant
                  description: Poll for tokens while approval is pending (grant_type=device_code)
                  type: object
                  required: [grant_type, device_code]
                  additionalProperties: false
                  properties:
                    grant_type:
                      type: string
                      enum: [urn:ietf:params:oauth:grant-type:device_code, device_code]
                      description: >-
                        The registered RFC 8628 URN (canonical, what the upstream token
                        endpoint requires) or the bare shorthand (accepted at this seam
                        and canonicalized to the URN before forwarding)
                    device_code:
                      type: string
                      description: >-
                        The `device_code` value returned by POST /agent/auth/device.
                        Poll with it at the interval that response named until approval
                        completes, expires, or is denied.
                - title: RefreshTokenGrant
                  description: Exchange a refresh token for a new access token (grant_type=refresh_token)
                  type: object
                  required: [grant_type, refresh_token]
                  additionalProperties: false
                  properties:
                    grant_type:
                      type: string
                      enum: [refresh_token]
                    refresh_token:
                      type: string
      responses:
        "200":
          description: >-
            Tokens. First approval returns access_token plus the initial refresh_token;
            a refresh exchange returns access_token plus a REPLACEMENT refresh_token
            (the old one is invalidated by the same call). An absent refresh_token
            signals revocation: restart the ceremony.
          content:
            application/json:
              schema:
                type: object
                required: [access_token]
                properties:
                  access_token:
                    type: string
                  refresh_token:
                    type: string
                    description: >-
                      Present on first approval and on every refresh exchange (rotation);
                      absent only when the grant is revoked or expired
        "400":
          description: >-
            Invalid grant_type or a missing credential for the grant returns the WAVE error
            envelope. A device_code that is not yet approved, not yet due for another poll, or no
            longer valid returns the RFC 8628 §3.5 device-flow error passed through verbatim, one
            of `authorization_pending` (not yet approved, keep polling), `slow_down` (poll less
            often), `expired_token` (the device_code expired, restart at /agent/auth/device),
            `access_denied` (the human declined), or `invalid_grant`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/DeviceFlowError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "502":
          description: Upstream auth endpoint unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Ceremony not configured on this deployment (no app id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /batch:
    post:
      operationId: batchOperations
      tags: [Batch]
      summary: Execute a batch of operations in one request
      description: |
        Bulk operations through the same pipeline: each operation is a method + /v1 path + optional body,
        executed with the caller's own credential (the same auth, scope, meter, and payment enforcement
        as an HTTP call - no bypass). Max 25 operations; each result carries its own status and body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties:
                operations:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    required: [method, path]
                    properties:
                      method:
                        type: string
                        enum: [GET, HEAD, POST, PUT, PATCH, DELETE]
                      path:
                        type: string
                        description: An enforced /v1 route
                      body:
                        description: The operation's JSON body (mutating methods only)
      responses:
        "200":
          description: Per-operation results
          content:
            application/json:
              schema:
                type: object
                properties:
                  operations:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        ok:
                          type: boolean
                        status:
                          type: integer
                        body:
                          description: The operation's response body
        "400":
          description: Invalid batch (operations[] required, 25-op cap)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited (RFC RateLimit headers on the response)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # Render API
  /render:
    post:
      tags: [Render]
      summary: Render a video from a Brief (x402-payable)
      operationId: renderVideo
      description: >-
        POST a typed Brief. Unpaid → 402 with a `WWW-Authenticate` x402 challenge; pay and retry.
        A bad brief → 400 before any charge. Paid → 200: the binary `video/mp4` by default, or a
        RenderResult envelope when you send `Accept: application/json` (always for 4K / alpha,
        delivered via a signed, expiring URL). Deterministic within a renderer version; `sha256`
        is the determinism receipt (also on the `x-wave-sha256` header).
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: A replayed key returns the original result without re-charging.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderBrief'
      responses:
        '200':
          description: The rendered video — binary, or a RenderResult envelope under Accept application/json.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/RenderResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '402':
          description: Payment required — pay the x402 challenge and retry.
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: The x402 challenge, including the quoted price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Output too large to return inline and no hosted delivery configured (OUTPUT_TOO_LARGE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '451':
          description: Content is on the operator deny/takedown list and will not be rendered (CONTENT_BLOCKED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /render/{jobId}:
    get:
      tags: [Render]
      summary: Poll an async render job
      operationId: renderPoll
      description: >-
        Fetch the current state of a render started asynchronously. Terminal states carry the
        delivery URL and the determinism receipt; poll until `status` is `done` or `error`.
        Prefer `/render/{jobId}/events` when you can hold a connection — it delivers the same
        frames without a polling loop.
      security: []
      parameters:
        - $ref: '#/components/parameters/RenderJobIdParam'
      responses:
        '200':
          description: The job view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderJobView'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          description: >-
            Job status temporarily unavailable — the job store did not answer. This is
            retryable and does NOT mean the job failed; back off and poll again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /render/{jobId}/events:
    get:
      tags: [Render]
      summary: Subscribe to an async render job (SSE)
      operationId: renderEvents
      description: >-
        Server-Sent Events stream of `RenderJobView` frames for a render job. One frame per state
        transition; the stream closes once the job reaches a terminal state (`done` or `error`).
        The final frame is identical to what `GET /render/{jobId}` would return at that moment.
      security: []
      parameters:
        - $ref: '#/components/parameters/RenderJobIdParam'
      responses:
        '200':
          description: SSE stream of RenderJobView frames.
          content:
            text/event-stream:
              schema:
                type: string
                description: >-
                  An SSE stream. Each `data:` line is a JSON-encoded `RenderJobView`.
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  # Clips API
  # Streams — live stream lifecycle (MCP-18 contract rows 1-7)
  /streams:
    get:
      tags: [Streams]
      summary: List streams
      description: >-
        List the caller's streams, newest first. Requires the `streams:read` scope.
      operationId: listStreams
      parameters:
        - name: limit
          in: query
          description: Maximum number of streams to return.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          description: Filter by stream status.
          schema:
            type: string
            enum: [idle, live, ended]
      responses:
        '200':
          description: Paginated list of streams
          content:
            application/json:
              schema:
                type: object
                required: [streams, total, limit, offset]
                properties:
                  streams:
                    type: array
                    items:
                      $ref: '#/components/schemas/Stream'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Streams]
      summary: Create a stream
      description: >-
        Create a stream. Provisions a Cloudflare Stream live input and returns its
        ingest/playback URLs. Requires the `streams:write` scope.
      operationId: createStream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStreamRequest'
      responses:
        '201':
          description: Stream created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stream'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /streams/{streamId}:
    get:
      tags: [Streams]
      summary: Get a stream
      description: Requires the `streams:read` scope.
      operationId: getStream
      parameters:
        - $ref: '#/components/parameters/StreamIdParam'
      responses:
        '200':
          description: Stream details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stream'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /streams/{streamId}/start:
    post:
      tags: [Streams]
      summary: Start a stream
      description: >-
        Transition a stream to `live` and open a stream session. Requires the
        `streams:write` scope.
      operationId: startStream
      parameters:
        - $ref: '#/components/parameters/StreamIdParam'
      responses:
        '200':
          description: Stream started
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream_id:
                    type: string
                  session_id:
                    type: string
                  status:
                    type: string
                    enum: [live]
                  ingest_url:
                    type: [string, 'null']
                  started_at:
                    type: string
                    format: date-time
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Stream is already live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /streams/{streamId}/stop:
    post:
      tags: [Streams]
      summary: Stop a stream
      description: >-
        Close the active stream session and transition the stream to `ended`.
        Requires the `streams:write` scope.
      operationId: stopStream
      parameters:
        - $ref: '#/components/parameters/StreamIdParam'
      responses:
        '200':
          description: Stream stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream_id:
                    type: string
                  session_id:
                    type: string
                  status:
                    type: string
                    enum: [ended]
                  ended_at:
                    type: string
                    format: date-time
                  duration_minutes:
                    type: number
                  viewer_count_peak:
                    type: integer
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Stream is not currently live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /streams/{streamId}/status:
    get:
      tags: [Streams]
      summary: Get a stream's status
      description: >-
        Lightweight status document (connection state, current viewer count).
        Requires the `streams:read` scope.
      operationId: getStreamStatus
      parameters:
        - $ref: '#/components/parameters/StreamIdParam'
      responses:
        '200':
          description: Stream status
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream_id:
                    type: string
                  status:
                    type: string
                    enum: [idle, live, ended]
                  current_viewers:
                    type: integer
                  protocol_active:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /streams/{streamId}/analytics:
    get:
      tags: [Streams]
      summary: Get a stream's analytics
      description: >-
        Aggregated viewer/quality metrics for one stream's sessions. Requires the
        `streams:read` scope.
      operationId: getStreamAnalytics
      parameters:
        - $ref: '#/components/parameters/StreamIdParam'
        - name: from
          in: query
          description: Range start (ISO 8601 timestamp).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Range end (ISO 8601 timestamp).
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Stream analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream_id:
                    type: string
                  metrics:
                    type: object
                    properties:
                      peak_concurrent_viewers:
                        type: integer
                      sample_count:
                        type: integer
                      avg_quality_score:
                        type: [number, 'null']
                  timeseries:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          format: date-time
                        viewer_count:
                          type: integer
                        quality_score:
                          type: [number, 'null']
                        latency_ms:
                          type: [number, 'null']
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /streams/{streamId}/highlights:
    get:
      tags: [Streams]
      summary: List a stream's highlights
      description: Requires the `streams:read` scope.
      operationId: listStreamHighlights
      parameters:
        - $ref: '#/components/parameters/StreamIdParam'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Paginated list of highlights
          content:
            application/json:
              schema:
                type: object
                properties:
                  highlights:
                    type: array
                    items:
                      $ref: '#/components/schemas/Highlight'
                  stream_id:
                    type: string
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundError'
    post:
      tags: [Streams]
      summary: Mark a highlight
      description: >-
        Mark a moment in a stream as a highlight for later clipping. Requires the
        `streams:write` scope.
      operationId: markStreamHighlight
      parameters:
        - $ref: '#/components/parameters/StreamIdParam'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 255
                timestamp:
                  type: string
                  format: date-time
                  description: Defaults to now.
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                duration_seconds:
                  type: number
                  minimum: 0
      responses:
        '201':
          description: Highlight marked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Highlight'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # Moderation
  /moderate:
    post:
      tags: [Moderate]
      summary: Moderate content
      description: >-
        Run AI-assisted moderation over a piece of text content (a chat message,
        title, description, comment, username, or bio) and get back an allow/flag/
        block/review verdict. Requires the `moderate:write` scope. To moderate a chat
        message, set `contentType` to `chat` and, optionally, `context.streamId` to
        the stream the message belongs to — this endpoint moderates arbitrary text
        content; it does not itself track a chat message id or apply an action to a
        stored message.
      operationId: moderateContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateRequest'
      responses:
        '200':
          description: Moderation verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerateResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  # Live Pipeline
  /live/pipeline:
    post:
      tags: [Live]
      summary: Transcribe an audio clip and run a fast-LLM step over it
      description: >-
        Transcribes ONE provided audio chunk (multipart `file`, max 25MB) and,
        given `llm_model`, optionally runs a fast-LLM step (`mode`: summarize,
        moderate, translate, or custom) over the transcript. This does NOT attach a
        persistent caption feed to a live stream — call it once per audio chunk.
        Requires the account's live-pipeline feature to be armed; a 404 means it is
        not enabled for this account. Requires the `captions:write` scope.
      operationId: startLivePipeline
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, llm_model]
              properties:
                file:
                  type: string
                  format: binary
                  description: Audio bytes to transcribe.
                stream_id:
                  type: string
                  maxLength: 128
                  pattern: '^[A-Za-z0-9._:-]{1,128}$'
                  description: >-
                    Client-chosen correlation id (letters, digits, `. _ : -`, 1-128
                    chars), echoed back for per-stream correlation.
                language:
                  type: string
                  description: ISO 639 language hint (transcribe task only).
                task:
                  type: string
                  enum: [transcribe, translate]
                  default: transcribe
                model:
                  type: string
                  enum: [whisper-large-v3-turbo, whisper-large-v3]
                  description: Default whisper-large-v3-turbo; translate forces whisper-large-v3.
                mode:
                  type: string
                  enum: [summarize, moderate, translate, custom]
                  default: summarize
                instruction:
                  type: string
                  maxLength: 500
                  description: Custom instruction, used when mode=custom.
                llm_model:
                  type: string
                  description: Fast LLM model id to run the pipeline step.
                max_tokens:
                  type: integer
                  minimum: 1
                  maximum: 4096
                  default: 256
      responses:
        '200':
          description: Transcript plus the LLM step's output
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcript:
                    type: string
                  duration:
                    type: number
                  llm:
                    type: object
                    properties:
                      mode:
                        type: string
                      model:
                        type: string
                      output:
                        type: string
                      usage:
                        type: object
                        properties:
                          prompt_tokens:
                            type: integer
                          completion_tokens:
                            type: integer
                  stream_id:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The live-pipeline feature is not armed for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          description: Transcription is temporarily unavailable — retry after the given delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /live/caption:
    post:
      tags: [Live]
      summary: Transcribe an audio clip
      description: >-
        Transcribes ONE provided audio chunk (multipart `file`, max 25MB) via the
        same caption engine `/live/pipeline` uses, without the LLM step. Requires
        the account's live-pipeline feature to be armed; a 404 means it is not
        enabled for this account. Requires the `captions:write` scope.
      operationId: transcribeLiveAudio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                stream_id:
                  type: string
                  maxLength: 128
                  pattern: '^[A-Za-z0-9._:-]{1,128}$'
                  description: >-
                    Client-chosen correlation id (letters, digits, `. _ : -`, 1-128
                    chars), echoed back for per-stream correlation.
                language:
                  type: string
                task:
                  type: string
                  enum: [transcribe, translate]
                  default: transcribe
                model:
                  type: string
                  enum: [whisper-large-v3-turbo, whisper-large-v3]
                response_format:
                  type: string
                  enum: [verbose_json, json, text]
                  default: verbose_json
                format:
                  type: string
                  enum: [json, vtt, srt, scc, text]
                  default: json
                  description: Output shape. Non-json returns a serialized caption file body.
                t0:
                  type: number
                  description: Windowed-mode start offset (seconds) on the stream timeline.
                seq:
                  type: integer
                  description: Windowed-mode window index, echoed back for ordering.
      responses:
        '200':
          description: Transcription result (JSON, or a serialized caption file when `format` != json)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: >-
                  Relays the transcription engine's JSON (text, segments, language,
                  duration) verbatim, plus `stream_id`/`window` when supplied.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The live-pipeline feature is not armed for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '503':
          description: Transcription is temporarily unavailable — retry after the given delay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Productions
  /productions:
    get:
      tags: [Productions]
      summary: List productions
      description: Requires the `productions:read` scope.
      operationId: listProductions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: status
          in: query
          schema:
            type: string
            enum: [setup, rehearsal, live, paused, ended]
      responses:
        '200':
          description: Paginated list of productions
          content:
            application/json:
              schema:
                type: object
                properties:
                  productions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Production'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:

          in: path
          required: true
          description: Document id, unique within `namespace`. Letters, digits, `.`, `_`, `:`, `-`, 1-128 characters.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._:-]{1,128}$'
          example: doc-1
        - name: namespace
          in: query
          required: true
          schema:
            type: string
            enum: [streams, users, clips, transcripts]

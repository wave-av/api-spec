        status:
          type: string
          enum: [offline, online, discovering, error]
        presets:
          type: array
          items:
            type: object
            additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RegisterCameraRequest:
      type: object
      required: [name, manufacturer, ipAddress, controlProtocol]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        manufacturer:
          type: string
          enum: [blackmagic, sony, canon, ptzoptics, other]
        model:
          type: string
        ipAddress:
          type: string
          format: ipv4
        controlProtocol:
          type: string
          enum: [bmd_rest, visca_ip, visca_serial, canon_xc, onvif]

    ControlCameraRequest:
      description: >-
        Discriminated union on `type`. Supply only the fields the chosen variant
        needs.
      oneOf:
        - type: object
          required: [type, value]
          properties:
            type:
              const: set_iris
            value:
              type: number
        - type: object
          required: [type, value]
          properties:
            type:
              const: set_focus
            value:
              type: number
        - type: object
          required: [type, value]
          properties:
            type:
              const: set_zoom
            value:
              type: number
        - type: object
          required: [type, temperature, tint]
          properties:
            type:
              const: set_white_balance
            temperature:
              type: number
            tint:
              type: number
        - type: object
          required: [type, value]
          properties:
            type:
              const: set_gain
            value:
              type: number
        - type: object
          required: [type, angle]
          properties:
            type:
              const: set_shutter
            angle:
              type: number
        - type: object
          required: [type]
          properties:
            type:
              const: start_recording
        - type: object
          required: [type]
          properties:
            type:
              const: stop_recording
        - type: object
          required: [type]
          properties:
            type:
              const: start_prerecord
        - type: object
          required: [type]
          properties:
            type:
              const: autofocus_trigger
        - type: object
          required: [type, channel, level]
          properties:
            type:
              const: set_audio_level
            channel:
              type: number
            level:
              type: number
        - type: object
          required: [type, presetId]
          properties:
            type:
              const: recall_preset
            presetId:
              type: string
              format: uuid
        - type: object
          required: [type, name, slot]
          properties:
            type:
              const: save_preset
            name:
              type: string
              minLength: 1
            slot:
              type: integer
              minimum: 1
              maximum: 20
      discriminator:
        propertyName: type

    DateRange:
      type: object

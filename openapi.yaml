          - label: mic-2
            track: mic-2
            url: https://wave.online/samples/input-2.mp4
      properties:
        ns:
          type: string
          description: Namespace for the published track. Republishing the same ns replaces the prior machine.
        sources:
          type: array
          minItems: 2
          description: >-
            Named audio sources to braid into one interleaved multichannel track, at least 2. Each
            source needs a `label`/`track` and either a `url` or a `path`.
          items:
            type: object
            required: [label, track]
            anyOf:
              - required: [url]
